name: Gate

# Reusable quality gate — the SINGLE source of truth for "is this tree shippable?".
# Called by ci.yml (every push/PR) and by release.yml (before it builds or publishes anything),
# so a release can never ship a tree that wouldn't pass CI. All checks are pure Node + a host-
# compiled C step (gcc is preinstalled on ubuntu-latest); no secrets, no network, no device.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # 22 (not 20): `node --test` expands the "tools/**/*.test.mjs" glob only on 21+

      - name: Registry + manifest validation
        run: node tools/validate.mjs

      - name: i18n catalog parity (5 languages)
        run: node tools/i18n-check.mjs

      - name: Gzip twins in sync (EOL-normalized)
        run: node tools/check-gz.mjs

      - name: Every shipped web source parses (JS, inline scripts, JSON)
        run: node tools/js-syntax-gate.mjs

      - name: API spec matches firmware routes
        run: node tools/gen-api-spec.mjs --check

      - name: Launcher icon parity (firmware ↔ web)
        run: node tools/check-icons.mjs

      - name: Unit tests (portable — pure JS logic)
        # tools/*.test.mjs only (single level): the tools/anima-host/*.test.mjs suites drive the full
        # ANIMA harness + host-compiled binaries and are covered by the local ANIMA gate (npm test),
        # not this fast portable CI gate.
        run: node --test tools/*.test.mjs

      - name: Native release-update policy (host-compiled C)
        run: node tools/anima-host/update-check.mjs

      - name: M5Launcher guest-mode policy (host-compiled C)
        run: node tools/anima-host/guest-check.mjs

      - name: App catalog matches the app manifests
        run: node tools/gen-app-catalog.mjs --check
      - name: Web-mode handoff page carries the shell boot splash
        run: node tools/gen-handoff.mjs --check

      - name: Registry loader scans apps.json one app at a time (host-compiled C)
        run: node tools/anima-host/regscan-check.mjs
      - name: Pairing-session table evicts LRU, never the live session (host-compiled C)
        run: node tools/anima-host/authslot-check.mjs

      - name: App registry limits (the C layer runs in the local gate, needs ESP-IDF cJSON)
        run: node tools/anima-host/registry-check.mjs

      - name: Stale .gz twin rule (firmware C + JS + Python agree; real files)
        run: node tools/anima-host/fstwin-check.mjs
