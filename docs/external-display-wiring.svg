<text x="40" y="519" font-size="13" fill="#333" font-weight="400">Module SD_CS / SD_MOSI / SD_MISO / SD_SCK: not connected (the Cardputer's own SD is used).</text>
<text x="40" y="539" font-size="13" fill="#333" font-weight="400">SDO unwired. Pins 6, 7, 9 take two wires each (Y-jumper or breadboard). Module jumper J1 must be OPEN.</text>
<text x="40" y="559" font-size="13" fill="#d62828" font-weight="700">Wire with the Cardputer switched OFF.</text>
