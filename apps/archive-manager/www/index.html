<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>/* NucleoOS resource guard: a lost same-origin script/stylesheet makes the shell reload this window once (wm.js retryFrame) */addEventListener('error',function(e){var t=e.target,u;if(!t||t===window||parent===window||(t.tagName!=='SCRIPT'&&t.tagName!=='LINK'))return;try{u=new URL(t.src||t.href,location.href);if(u.origin===location.origin)parent.postMessage({type:'app-resource-failed',src:u.pathname},location.origin)}catch(_){}},true)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app_title">Archive Manager</title>
  <style>
    /* Native controls and scrollbars follow the app theme. */
    :root { color-scheme: dark; } html[data-theme="light"] { color-scheme: light; }
    :root {
      --bg: #0e1830;
      --panel: #18233a;
      --text: #e8eefc;
      --muted: #8aa0c8;
      --accent: #4ea1ff;
      --line: #2a3a5e;
      --danger: #ff8093;
    }
    html[data-theme="light"] {
      --bg: #eef2fb;
      --panel: #ffffff;
      --text: #10203a;
      --muted: #5a6a86;
      --accent: #2b6fd6;
      --line: #cdd8ee;
      --danger: #c0392b;
      --field: #f4f7fe;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px system-ui, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; user-select: none;
    }
    header {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--panel); border-bottom: 1px solid var(--line); flex: none;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .sp { flex: 1; }
    button {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
      background: #ffffff10; color: var(--text); border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit;
    }
    button:hover { background: #ffffff1f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #07101f; border-color: var(--accent); font-weight: 500; }
    button.primary:hover { background: #6eb3ff; }

    .main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
    
    .status-bar {
      padding: 6px 12px; font-size: 12px; color: var(--muted); background: var(--panel);
      border-bottom: 1px solid var(--line); flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: flex; align-items: center; gap: 8px;
    }
    .status-bar input {
      background: var(--field, #0b1220); border: 1px solid var(--line); color: var(--text);
      border-radius: 4px; padding: 3px 6px; font: inherit; font-size: 12px; width: 150px;
    }
    
    .file-list {
      flex: 1; overflow: auto; list-style: none; margin: 0; padding: 0;
    }
    .file-list li {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px;
      border-bottom: 1px solid #ffffff0a;
    }
    .file-list li:hover { background: #ffffff12; }
    .file-list .glyph { width: 20px; text-align: center; flex: none; }
    .file-list .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list .size { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; flex: none; }
    
    .empty { padding: 40px 20px; text-align: center; color: var(--muted); }
    .empty .icon { font-size: 40px; margin-bottom: 10px; opacity: 0.7; }
    
    .overlay {
      position: absolute; inset: 0; background: #000a; display: grid; place-items: center; z-index: 10;
      backdrop-filter: blur(3px);
    }
    .overlay.hidden { display: none; }
    .progress-box {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      padding: 20px; width: 300px; text-align: center; box-shadow: 0 10px 40px #000a;
    }
    .progress-bar { height: 6px; background: #ffffff14; border-radius: 4px; margin: 15px 0 10px; overflow: hidden; }
    .progress-bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }
    .progress-text { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <h1><span style="font-size:18px">🗜️</span> <span data-i18n="app_title">Archive Manager</span></h1>
    <span class="sp"></span>
    <button id="btn-action" class="primary" disabled>
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 12V3M4 8l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 14h12" stroke-linecap="round"/></svg>
      <span id="btn-label" data-i18n="extract_here">Extract Here</span>
    </button>
  </header>

  <div class="main">
    <div class="status-bar" id="status" data-i18n="status_idle">No archive loaded. Waiting for an archive...</div>
    <ul class="file-list" id="list">
      <div class="empty">
        <div class="icon">📂</div>
        <div data-i18n="empty_open_hint">Open a .zip file from the File Commander</div>
      </div>
    </ul>

    <div id="overlay" class="overlay hidden">
      <div class="progress-box">
        <div id="prog-title" style="font-weight:500;margin-bottom:5px" data-i18n="working">Working...</div>
        <div class="progress-bar"><div id="prog-fill"></div></div>
        <div id="prog-text" class="progress-text" data-i18n="prog_files" data-i18n-args='{"done":0,"total":0,"count":0}'>0 / 0 files</div>
      </div>
    </div>
  </div>

  <script>
    // i18n bridge: the bootstrap module (below) installs the real translator via
    // window.__amI18n. Until it's ready, fall back to the embedded English strings
    // so first paint never breaks. onReady re-runs imperative redraws on language switch.
    const I18N_FALLBACK = {
      status_idle: "No archive loaded. Waiting for an archive...",
      extract_here: "Extract Here", compress: "Compress",
      err_parse_compress: "Error parsing files to compress.",
      loading_file: "Loading {path}...", loading_archive: "Loading archive...",
      items_in: "{count} items in {path}", error_x: "Error: {msg}",
      open_failed: "Failed to open archive.", archive_empty: "This archive is empty.",
      extracting_to: "Extracting to {dir}", extracting_file: "Extracting {name}... ({done}/{total})",
      extract_complete: "Extraction Complete!", files_extracted: "{count} files extracted.",
      extract_error: "Extraction Error", create_in: "Create archive in {dir}",
      name_label: "Name:", format_label: "Format:", preparing: "Preparing files...", scanning: "Scanning directories...",
      compressing: "Compressing...", reading_file: "Reading {name}... ({i}/{total})",
      generating_zip: "Generating .zip file...", saving_archive: "Saving archive...",
      compress_complete: "Compression Complete!", saved_x: "Saved {name}",
      compress_error: "Compression Error", no_files: "No files to compress",
      err_read_file: "Couldn't read the archive from the device (error {status}).",
      err_write_file: "Couldn't write {name} (error {status}).",
      err_mkdir: "Couldn't create the folder {name} (error {status}).",
      err_list_dir: "Couldn't list the folder {name} (error {status}).",
      err_read_src: "Couldn't read {name} (error {status}).",
      err_save_archive: "Couldn't save {name} (error {status}).",
      confirm_overwrite: "{count} file(s) already exist and will be overwritten:\n{names}\n\nExtract anyway?"
    };
    const t = (key, args) => {
      if (window.__amI18n) return window.__amI18n(key, args);
      let s = I18N_FALLBACK[key] || key;
      if (args) for (const k in args) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), args[k]);
      return s;
    };
    // Set by views that need a re-render on language change. It MUST live on window: the i18n module below
    // reads window.__amRedraw, and a top-level `let` in a classic script is not a window property (it was
    // always undefined there, so compress mode was never re-translated).
    window.__amRedraw = null;
    window.__amOnI18n = (cb) => { window.__amRedraw = cb; };

    // The device's disk, through the core file layer (loaded once; this is a classic script).
    let fsMod = null;
    const getFs = async () => fsMod || (fsMod = (await import('/nucleo-fs.js')).default);
    // The OS around this window (dialogs drawn by the shell), loaded once like the file layer.
    let osMod = null;
    const getOs = async () => osMod || (osMod = (await import('/nucleo-shell.js')).default);
    // Archives in every format (ZIP, 7z, RAR, tar…): the OS's own layer (shell/nucleo-pack.js), the same in every app
    // and on every device.
    let packMod = null;
    const getPack = async () => packMod || (packMod = await import('/nucleo-pack.js'));
    // The archive's own name decides only whether to try; its content decides the format.
    const ARCHIVE_EXT = /\.(zip|7z|rar|tar|gz|tgz|bz2|tbz2?|xz|txz|zst|tzst|lz4|lzma|tlz|z|iso|cab|cpio|ar|deb|rpm|xar|lha|lzh|warc)$/i;
    let currentPassword = '';
    // Run one disk step; a refused request becomes the given catalog error with the device's HTTP answer as
    // {status}; a lost connection keeps its own message, as before.
    const step = (p, key, args) => p.catch((err) => { if (err && err.status) throw i18nErr(key, { ...args, status: err.status }); throw err; });
    const parent = (p) => p.replace(/\/[^/]+\/?$/, '') || '/';
    const fmt = (b) => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : b >= 1024 ? (b / 1024).toFixed(0) + ' KB' : b + ' B';
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    let mode = 'extract'; // 'extract' or 'compress'
    const FORMATS = ['zip', '7z', 'tar.gz', 'tar.xz', 'tar.bz2', 'tar.zst', 'tar'];   // what shell/nucleo-pack.js writes
    let currentZipPath = null;
    let currentZipBytes = null;
    let zipEntries = []; // Per extract
    let sourcePaths = []; // Per compress (absolute paths)
    let destDir = ''; // Per compress

    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const btnAction = document.getElementById('btn-action');
    const btnLabel = document.getElementById('btn-label');
    const overlay = document.getElementById('overlay');
    const progTitle = document.getElementById('prog-title');
    const progFill = document.getElementById('prog-fill');
    const progText = document.getElementById('prog-text');

    // Parse query params al caricamento
    const urlParams = new URLSearchParams(window.location.search);
    const compressParam = urlParams.get('compress');
    
    if (compressParam) {
      mode = 'compress';
      try {
        sourcePaths = JSON.parse(compressParam);
        if (sourcePaths.length > 0) {
          destDir = parent(sourcePaths[0]);
          initCompressMode();
        }
      } catch(e) {
        statusEl.removeAttribute('data-i18n');
        statusEl.textContent = t('err_parse_compress');
      }
    }

    // Opened by the shell on a .zip (double-click / Open with): WM.open passes ?path=...
    const pathParam = urlParams.get('path');
    if (!compressParam && pathParam && ARCHIVE_EXT.test(pathParam)) {
      mode = 'extract';
      loadZip(pathParam);
    }

    // Handle open-file event from the OS (modalità estrazione)
    window.addEventListener('message', async (e) => {
      const d = e.data;
      if (d && d.type === 'open-file' && d.path) {
        if (ARCHIVE_EXT.test(d.path)) {
          mode = 'extract';
          await loadZip(d.path);
        }
      }
    });

    // ==========================================
    // EXTRACT MODE
    // ==========================================
    // An error whose text is a catalog key: it is re-translated when the OS language switches.
    const i18nErr = (key, args) => Object.assign(new Error(t(key, args)), { i18n: { key, args } });
    const errText = (err) => {
      if (err && err.i18n) return t(err.i18n.key, err.i18n.args);
      const k = packMod && packMod.messageKey(err);                       // the archive's fault: the OS's own words
      return k ? t(k) : String((err && err.message) || err);
    };

    async function loadZip(path) {
      // Every extract-mode view repaints itself on a language switch (and once the i18n engine is up: a
      // ?path= open starts before it, so the first paint uses the English fallback).
      const paintLoading = () => {
        statusEl.removeAttribute('data-i18n');
        statusEl.innerHTML = t('loading_file', { path: esc(path) });
        listEl.innerHTML = `<div class="empty">${esc(t('loading_archive'))}</div>`;
      };
      paintLoading(); window.__amOnI18n(paintLoading);
      btnAction.disabled = true;
      btnLabel.setAttribute('data-i18n', 'extract_here');
      btnLabel.textContent = t('extract_here');

      try {
        const fs = await getFs();
        const bytes = await step(fs.read(path), 'err_read_file', {});
        if (!bytes) throw i18nErr('err_read_file', { status: 404 });
        const pack = (await getPack()).default;
        currentPassword = '';
        const listed = await pack.list(bytes, { name: path.split('/').pop() });
        zipEntries = listed.entries;
        currentZipBytes = bytes;
        currentZipPath = path;

        zipEntries.sort((a, b) => {
          if (a.dir === b.dir) return a.name.localeCompare(b.name);
          return a.dir ? -1 : 1;
        });

        const paintLoaded = () => {
          renderExtractList();
          statusEl.removeAttribute('data-i18n');
          statusEl.innerHTML = t('items_in', { count: zipEntries.length, path: esc(path) });
        };
        paintLoaded(); window.__amOnI18n(paintLoaded);
        btnAction.disabled = zipEntries.length === 0;
      } catch (err) {
        const paintError = () => {
          statusEl.removeAttribute('data-i18n');
          statusEl.textContent = t('error_x', { msg: errText(err) });
          listEl.innerHTML = `<div class="empty" style="color:var(--danger)">${esc(t('open_failed'))}<br><small>${esc(errText(err))}</small></div>`;
        };
        paintError(); window.__amOnI18n(paintError);
      }
    }

    function renderExtractList() {
      listEl.innerHTML = '';
      if (zipEntries.length === 0) {
        listEl.innerHTML = `<div class="empty">${esc(t('archive_empty'))}</div>`;
        return;
      }

      zipEntries.forEach(entry => {
        const li = document.createElement('li');
        const isDir = entry.dir;
        const glyph = isDir ? '📁' : '📄';
        const sizeStr = isDir ? '' : fmt(entry.size);
        
        li.innerHTML = `<span class="glyph">${glyph}</span><span class="name">${esc(entry.name)}</span><span class="size">${sizeStr}</span>`;
        listEl.appendChild(li);
      });
    }

    const joinPath = (dir, rel) => (dir === '/' ? '' : dir) + '/' + rel.replace(/\/+$/, '');
    // Unsafe names ("..", absolute, drive letters, backslash tricks) are refused by shell/nucleo-zip.js itself.
    // Names already present in a folder (empty = the folder does not exist yet). Anything but an absent
    // folder is an error: we cannot promise "nothing gets overwritten" about a folder we could not list.
    // Compared without case: a FAT card holds one "readme.txt" whatever the archive spells it.
    async function listNames(dir) {
      const fs = await getFs();
      return new Set((await step(fs.list(dir), 'err_list_dir', { name: dir })).map((e) => e.name.toLowerCase()));
    }
    // Archive files whose target already exists. Only the folders the archive writes into are listed.
    async function findClashes(targetDir) {
      const byDir = new Map();
      for (const e of zipEntries) {
        if (e.dir || e.unsafe || !e.path) continue;                   // unsafe names are never written
        // the name as it will be WRITTEN (e.path: normalised by the core), not as the archive spells it
        const full = joinPath(targetDir, e.path);
        const d = parent(full);
        if (!byDir.has(d)) byDir.set(d, []);
        byDir.get(d).push({ base: full.split('/').pop().toLowerCase(), rel: e.path });
      }
      const out = [];
      for (const [d, files] of byDir) {
        const names = await listNames(d);
        for (const f of files) if (names.has(f.base)) out.push(f.rel);
      }
      return out;
    }
    async function executeExtract() {
      if (!currentZipBytes || !currentZipPath) return;
      const targetDir = parent(currentZipPath);
      // A protected archive: the password first, asked by the OS (never shown, never kept after this window).
      if (zipEntries.some((e) => e.encrypted) && !currentPassword) {
        currentPassword = (await (await getOs()).prompt(t('zip_password_ask', { name: currentZipPath.split('/').pop() }), { password: true })) || '';
        if (!currentPassword) return;
      }
      // Never overwrite a file silently: list what already exists and ask once.
      let clashes;
      try { clashes = await findClashes(targetDir); }
      catch (err) { statusEl.removeAttribute('data-i18n'); statusEl.textContent = t('error_x', { msg: errText(err) }); return; }
      if (clashes.length) {
        const names = clashes.slice(0, 8).join('\n') + (clashes.length > 8 ? '\n…' : '');
        if (!(await (await getOs()).confirm(t('confirm_overwrite', { count: clashes.length, names }), { danger: true }))) return;
      }
      overlay.classList.remove('hidden');
      progTitle.removeAttribute('data-i18n');
      progText.removeAttribute('data-i18n'); progText.removeAttribute('data-i18n-args');
      progTitle.textContent = t('extracting_to', { dir: targetDir });

      try {
        const fs = await getFs();
        const pack = (await getPack()).default;
        let doneFiles = 0;
        const totalFiles = zipEntries.filter((e) => !e.dir).length;
        // Confirmed above: what clashes is replaced; everything else lands next to the archive.
        // Only what the user confirmed above is replaced; anything else that turns out to exist gets "name (2)".
        const confirmed = new Set(clashes.map((n) => n.toLowerCase()));
        const password = currentPassword;
        currentPassword = '';                                         // used once, not kept
        const r = await pack.extractTo(fs, currentZipBytes, targetDir, {
          overwrite: confirmed, password, name: currentZipPath.split('/').pop(),
          onProgress: (done, total, name) => {
            doneFiles++;
            progText.textContent = t('extracting_file', { name, done: doneFiles, total: totalFiles });
            progFill.style.width = Math.floor((total ? done / total : 1) * 100) + '%';
          },
        });
        doneFiles = r.files;
        progTitle.textContent = t('extract_complete');
        progText.textContent = t('files_extracted', { count: doneFiles }) + (r.skipped.length ? ' ' + t('zip_skipped', { count: r.skipped.length }) : '');
        window.parent.postMessage({ type: 'fs.changed' }, '*');

        setTimeout(() => { overlay.classList.add('hidden'); }, 1500);
      } catch (err) {
        progTitle.textContent = t('extract_error');
        progText.textContent = errText(err);
        progFill.style.background = 'var(--danger)';
        setTimeout(() => { overlay.classList.add('hidden'); progFill.style.background = 'var(--accent)'; }, 3000);
      }
    }

    // ==========================================
    // COMPRESS MODE
    // ==========================================
    function initCompressMode() {
      btnLabel.setAttribute('data-i18n', 'compress');
      btnLabel.textContent = t('compress');
      btnAction.disabled = false;

      // Preserve a name the user may have already typed across a language switch.
      const existing = document.getElementById('zip-name');
      let defaultName;
      if (existing && existing.value.trim()) {
        defaultName = existing.value;
      } else {
        // Default archive name (es. cartella corrente o primo file)
        defaultName = sourcePaths.length === 1 ? sourcePaths[0].split('/').pop() : 'archive';
        const lastDot = defaultName.lastIndexOf('.');
        if (lastDot > 0) defaultName = defaultName.slice(0, lastDot);
      }
      const fmtEl = document.getElementById('zip-format');
      const format = fmtEl ? fmtEl.value : 'zip';

      statusEl.removeAttribute('data-i18n');
      statusEl.innerHTML = `
        <span class="sp">${t('create_in', { dir: esc(destDir) })}</span>
        <label>${t('name_label')} <input type="text" id="zip-name" value="${esc(defaultName.replace(/\.(tar\.[a-z0-9]+|zip|7z|tgz)$/i, ''))}"></label>
        <label>${t('format_label')} <select id="zip-format">${FORMATS.map((f) => `<option value="${f}"${f === format ? ' selected' : ''}>.${f}</option>`).join('')}</select></label>
      `;
      // Re-render this view when the OS language switches (imperative DOM).
      window.__amOnI18n(initCompressMode);

      listEl.innerHTML = '';
      sourcePaths.forEach(p => {
        const name = p.split('/').pop();
        const li = document.createElement('li');
        li.innerHTML = `<span class="glyph">📦</span><span class="name">${esc(p)}</span>`;
        listEl.appendChild(li);
      });
    }

    async function walkDir(dirPath, filesOut) {
      const fs = await getFs();
      for (const e of await step(fs.list(dirPath), 'err_list_dir', { name: dirPath })) {
        const full = dirPath === '/' ? `/${e.name}` : `${dirPath}/${e.name}`;
        if (e.type === 'dir') {
          await walkDir(full, filesOut);
        } else {
          filesOut.push({ path: full, size: e.size });
        }
      }
    }

    async function executeCompress() {
      const inputEl = document.getElementById('zip-name');
      const format = (document.getElementById('zip-format') || {}).value || 'zip';
      let zipName = (inputEl ? inputEl.value.trim() : '') || 'archive';
      if (!zipName.toLowerCase().endsWith('.' + format)) zipName += '.' + format;
      
      overlay.classList.remove('hidden');
      progTitle.removeAttribute('data-i18n');
      progText.removeAttribute('data-i18n'); progText.removeAttribute('data-i18n-args');
      progTitle.textContent = t('preparing');
      progText.textContent = t('scanning');
      progFill.style.width = '0%';
      
      try {
        const fs = await getFs();
        // 1. Gather all files
        let filesToZip = []; // { path: string, relative: string }
        for (const sp of sourcePaths) {
          const sName = sp.split('/').pop();
          // /api/fs/list on a FILE returns 200 with entries:[] (the server swallows
          // NotADirectoryError), so "list ok" cannot tell a file from a dir — a
          // file would fall into the dir branch, walkDir yields [], and it silently
          // vanishes from the zip. Decide from the PARENT's listing instead (that is what fs.stat reads).
          let isDir = false;
          try { const st = await fs.stat(sp); isDir = !!st && st.type === 'dir'; } catch (e) { isDir = false; }
          if (isDir) {
            const subFiles = [];
            await walkDir(sp, subFiles);
            subFiles.forEach(sf => {
              const relative = sName + sf.path.slice(sp.length);
              filesToZip.push({ path: sf.path, relative });
            });
          } else {
            filesToZip.push({ path: sp, relative: sName });
          }
        }

        if (filesToZip.length === 0) throw i18nErr('no_files');

        // 2. Read every file, then pack them in the chosen format (shell/nucleo-pack.js)
        const pack = (await getPack()).default;
        const items = [];
        const total = filesToZip.length;
        for (let i = 0; i < total; i++) {
          const f = filesToZip[i];
          progTitle.textContent = t('compressing');
          progText.textContent = t('reading_file', { name: f.relative, i: i, total: total });
          progFill.style.width = Math.floor((i / total) * 60) + '%';
          const buf = await step(fs.read(f.path), 'err_read_src', { name: f.path });
          if (!buf) throw i18nErr('err_read_src', { name: f.path, status: 404 });
          items.push({ name: f.relative, data: buf });
        }
        progText.textContent = t('generating_zip');
        progFill.style.width = '70%';
        const bytes = await pack.create(items, { format });

        // 3. Save the ZIP on the device, next to the sources, never over an existing file
        progText.textContent = t('saving_archive');
        progFill.style.width = '90%';
        const outPath = await fs.uniquePath(destDir, zipName);
        zipName = outPath.split('/').pop();
        await step(fs.write(outPath, bytes, { overwrite: false }), 'err_save_archive', { name: zipName });

        progFill.style.width = '100%';
        progTitle.textContent = t('compress_complete');
        progText.textContent = t('saved_x', { name: zipName });
        window.parent.postMessage({ type: 'fs.changed' }, '*');

        setTimeout(() => { overlay.classList.add('hidden'); }, 1500);

      } catch(err) {
        progTitle.textContent = t('compress_error');
        progText.textContent = errText(err);
        progFill.style.background = 'var(--danger)';
        setTimeout(() => { overlay.classList.add('hidden'); progFill.style.background = 'var(--accent)'; }, 3000);
      }
    }

    // ==========================================
    // ACTION BUTTON
    // ==========================================
    btnAction.onclick = () => {
      if (mode === 'extract') executeExtract();
      else if (mode === 'compress') executeCompress();
    };

  </script>

  <script type="module">
    // Centralized OS i18n: paints all [data-i18n] DOM, auto-translates DOM added later,
    // and live-switches with the OS language. We also expose t() to the (non-module)
    // app script above for its imperatively-built strings, and re-run its registered
    // redraw on language change so views built in JS follow the switch too.
    import I18N from '/nucleo-i18n.js';
    const t = await I18N.init('archive-manager');
    window.__amI18n = t;
    const redraw = () => { if (typeof window.__amRedraw === 'function') window.__amRedraw(); };
    redraw();                 // translate any imperative DOM rendered before init finished
    I18N.onChange(redraw);    // and again on every live language switch
  </script>
</body>
</html>
