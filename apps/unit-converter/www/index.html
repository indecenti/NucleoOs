<html>
<head>
<meta charset="utf-8">
<script>/* NucleoOS resource guard: a lost same-origin script/stylesheet makes the shell reload this window once (wm.js retryFrame) */addEventListener('error',function(e){var t=e.target,u;if(!t||t===window||parent===window||(t.tagName!=='SCRIPT'&&t.tagName!=='LINK'))return;try{u=new URL(t.src||t.href,location.href);if(u.origin===location.origin)parent.postMessage({type:'app-resource-failed',src:u.pathname},location.origin)}catch(_){}},true)</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="title">Unit Converter</title>
<style>
  /* Colours live in CSS variables so the app follows the OS light/dark theme. color-scheme is set
     per-theme (not force-dark) so native <select>/<input type=number> controls match the surface. */
  :root {
    color-scheme: dark;
    --bg:#0e1830; --panel:#16223f; --panel2:#23345c; --text:#e8eefc;
    --muted:#8fa0c8; --accent:#2fa36b; --line:#243352; --border:#2c3d63;
    --field:#0e1830; --btn2-text:#cfe; --err:#ff9db0;
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg:#eef2fb; --panel:#ffffff; --panel2:#e6ecf8; --text:#10203a;
    --muted:#5a6a86; --accent:#1f7a4d; --line:#cdd8ee; --border:#c3d0ea;
    --field:#ffffff; --btn2-text:#20365e; --err:#c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 12px; font-size: 22px; display: flex; align-items: center; gap: 8px; }
  h1 .g { color: var(--accent); }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tab { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 999px;
    padding: 6px 13px; cursor: pointer; font-size: 14px; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .nl { display: flex; gap: 8px; align-items: center; }
  .nl .star { color: var(--accent); font-size: 20px; }
  .nl input { flex: 1; }
  input, select { font: inherit; background: var(--field); color: var(--text); border: 1px solid var(--border);
    border-radius: 9px; padding: 9px 11px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .conv { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
  .conv label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .conv .col { min-width: 0; }
  .conv .col input, .conv .col select { width: 100%; }
  .swap { background: var(--panel2); border: 1px solid var(--border); color: var(--btn2-text); border-radius: 9px;
    padding: 9px 12px; cursor: pointer; font-size: 18px; align-self: end; }
  .swap:active { transform: translateY(1px); }
  .out { margin-top: 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .out .big { font-size: 40px; font-weight: 700; letter-spacing: .5px; }
  .out .u { font-size: 20px; color: var(--muted); }
  .copy { margin-left: auto; background: var(--panel2); border: 1px solid var(--border); color: var(--btn2-text);
    border-radius: 9px; padding: 7px 13px; cursor: pointer; font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .hint.err { color: var(--err); }
  .hh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .hh h2 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
  .hh button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { padding: 8px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 14px; color: var(--text); }
  li:last-child { border-bottom: 0; }
  li .r { color: var(--accent); }
  .muted { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <h1><span class="g">⇄</span> <span data-i18n="title">Unit Converter</span></h1>

  <div class="card">
    <div class="nl">
      <span class="star">✦</span>
      <input id="nl" data-i18n-attr="placeholder:nl.placeholder" autocomplete="off">
    </div>
    <div class="hint" id="hint" data-i18n="nl.hint">Type a value, or ask in natural language.</div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="conv">
      <div class="col">
        <label data-i18n="from">From</label>
        <input id="val" type="number" inputmode="decimal" value="1">
        <select id="from"></select>
      </div>
      <button class="swap" id="swap" title="Swap" data-i18n-attr="title:swap;aria-label:swap">⇄</button>
      <div class="col">
        <label data-i18n="to">To</label>
        <div class="out"><span class="big" id="big">—</span><span class="u" id="unit"></span></div>
        <select id="to"></select>
      </div>
    </div>
    <div class="out" style="margin-top:14px">
      <button class="copy" id="copy" data-i18n="copy">Copy</button>
    </div>
  </div>

  <div class="card">
    <div class="hh"><h2 data-i18n="history">Recent</h2><button id="clear" data-i18n="clear">Clear</button></div>
    <ul id="hist"></ul>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import I18N from '/nucleo-i18n.js';
    import os from '/nucleo-shell.js';
    import { UNITS, unitsInCategory, categoryOf, convert, fmt, runCommand } from './convert.js';
    const t = await I18N.init('unit-converter');
    const lang = I18N.lang;   // the OS language (anima.lang); 'nucleo.lang' was never written, so this read the page default

    const $ = (id) => document.getElementById(id);
    // Friendly display labels; anything not listed shows its canonical symbol as-is.
    const LABEL = { C: '°C', F: '°F', K: 'K', m3: 'm³', floz: 'fl oz', mps: 'm/s', kmh: 'km/h', fps: 'ft/s', um: 'µm' };
    const label = (u) => LABEL[u] || u;
    const DEFAULTS = { length: ['km', 'mi'], mass: ['kg', 'lb'], temperature: ['C', 'F'],
      volume: ['l', 'gal'], data: ['GB', 'MB'], speed: ['kmh', 'mph'], time: ['h', 'min'] };
    const CATS = Object.keys(UNITS);

    let cat = 'length', from = 'km', to = 'mi';

    // ── tabs ──
    const tabsEl = $('tabs');
    for (const c of CATS) {
      const b = document.createElement('button');
      b.className = 'tab'; b.dataset.cat = c; b.textContent = t('cat.' + c);
      b.addEventListener('click', () => selectCat(c));
      tabsEl.appendChild(b);
    }
    function fillSelect(sel, current) {
      sel.innerHTML = '';
      for (const u of unitsInCategory(cat)) {
        const o = document.createElement('option');
        o.value = u; o.textContent = label(u);
        if (u === current) o.selected = true;
        sel.appendChild(o);
      }
    }
    function selectCat(c, keep) {
      cat = c;
      if (!keep) { [from, to] = DEFAULTS[c] || unitsInCategory(c); }
      for (const b of tabsEl.children) b.classList.toggle('on', b.dataset.cat === c);
      fillSelect($('from'), from); fillSelect($('to'), to);
      doConvert();
    }

    // ── convert ──
    function doConvert() {
      from = $('from').value; to = $('to').value;
      const r = convert($('val').value, from, to);
      $('unit').textContent = label(to);
      $('big').textContent = r.ok ? fmt(r.value, I18N.locale()) : '—';
    }
    $('val').addEventListener('input', doConvert);
    $('from').addEventListener('change', doConvert);
    $('to').addEventListener('change', doConvert);
    $('swap').addEventListener('click', () => {
      const a = $('from').value, b = $('to').value;
      from = b; to = a; fillSelect($('from'), from); fillSelect($('to'), to); doConvert();
    });

    // ── natural language ──
    const hint = $('hint');
    function setHint(msg, err) { hint.textContent = msg; hint.classList.toggle('err', !!err); }
    $('nl').addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const q = e.target.value.trim();
      if (!q) return;
      const r = runCommand(q, lang);
      if (!r.ok) { setHint(r.reason === 'cross-category' ? t('nl.cross') : t('nl.unknown'), true); return; }
      selectCat(r.category, true);
      from = r.from; to = r.to;
      $('val').value = r.value; fillSelect($('from'), from); fillSelect($('to'), to);
      doConvert();
      setHint(t('nl.hint'), false);
      pushHist(q, r);
      e.target.value = '';
    });

    // ── history (localStorage) ──
    const HKEY = 'uc.history';
    const load = () => { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch { return []; } };
    const save = (h) => localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 12)));
    function pushHist(q, r) {
      const h = load();
      h.unshift({ q, value: r.value, from: r.from, to: r.to, cat: r.category, result: r.result });
      save(h); renderHist();
    }
    function renderHist() {
      const h = load(), ul = $('hist'); ul.innerHTML = '';
      if (!h.length) { const li = document.createElement('li'); li.className = 'muted'; li.textContent = t('empty'); ul.appendChild(li); return; }
      for (const e of h) {
        const li = document.createElement('li');
        li.innerHTML = `${e.value} ${label(e.from)} → <span class="r">${fmt(e.result, I18N.locale())} ${label(e.to)}</span>`;
        li.addEventListener('click', () => { selectCat(e.cat, true); from = e.from; to = e.to; $('val').value = e.value; fillSelect($('from'), from); fillSelect($('to'), to); doConvert(); });
        ul.appendChild(li);
      }
    }
    $('clear').addEventListener('click', () => { save([]); renderHist(); });

    // ── copy ──
    const toast = $('toast');
    let toastT = null;
    function showToast(msg) { toast.textContent = msg; toast.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove('show'), 1400); }
    $('copy').addEventListener('click', async () => {
      const txt = $('big').textContent + ' ' + $('unit').textContent;
      os.copy(txt);   // the OS clipboard history (and the system clipboard where the page may use it)
      showToast(t('copied'));
    });

    // ── OS theme: the shell sets data-theme on this page on load and on every change (nucleo-shell.js) ──

    // ── boot ──
    selectCat('length');
    renderHist();
    I18N.onChange(() => {
      for (const b of tabsEl.children) b.textContent = t('cat.' + b.dataset.cat);
      setHint(t('nl.hint'), false);
      renderHist();
    });
  </script>
</body>
</html>
