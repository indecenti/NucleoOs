<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>/* NucleoOS resource guard: a lost same-origin script/stylesheet makes the shell reload this window once (wm.js retryFrame) */addEventListener('error',function(e){var t=e.target,u;if(!t||t===window||parent===window||(t.tagName!=='SCRIPT'&&t.tagName!=='LINK'))return;try{u=new URL(t.src||t.href,location.href);if(u.origin===location.origin)parent.postMessage({type:'app-resource-failed',src:u.pathname},location.origin)}catch(_){}},true)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app_title">File Commander</title>
  <link rel="stylesheet" href="fm.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" data-i18n-attr="aria-label:side_label">
      <div class="tree" id="tree" role="tree"></div>
      <div class="side-foot"><button class="btn" id="add-loc" type="button" data-icon="folder-new"><span data-i18n="add_folder">Add a folder</span></button></div>
    </aside>
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"></div>
    <div class="side-scrim" id="side-scrim" hidden></div>
    <main class="main">
      <header class="nav">
        <button class="ib only-narrow" id="b-side" type="button" data-icon="list" aria-expanded="false" data-i18n-attr="title:side_toggle;aria-label:side_toggle"></button>
        <button class="ib" id="b-back" type="button" data-icon="back" data-i18n-attr="title:nav_back;aria-label:nav_back"></button>
        <button class="ib" id="b-fwd" type="button" data-icon="forward" data-i18n-attr="title:nav_forward;aria-label:nav_forward"></button>
        <button class="ib" id="b-up" type="button" data-icon="up" data-i18n-attr="title:up_title;aria-label:up_title"></button>
        <div class="addr" id="addr">
          <nav class="crumbs" id="crumbs" data-i18n-attr="aria-label:addr_label"></nav>
          <input id="addr-in" type="text" hidden autocomplete="off" spellcheck="false" data-i18n-attr="aria-label:addr_label">
        </div>
        <button class="ib" id="b-refresh" type="button" data-icon="refresh" data-i18n-attr="title:refresh_title;aria-label:refresh_title"></button>
        <div class="find" id="findbox">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.6 10.6L14 14" stroke-linecap="round"/></svg>
          <input id="find" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:search_ph;aria-label:search_aria">
          <button class="ib" id="b-deep" type="button" aria-pressed="false" data-i18n-attr="title:search_deep;aria-label:search_deep"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3.5h4l1 1.2h4.5V7"/><path d="M2 3.5V12h4.5"/><circle cx="10.5" cy="10.5" r="2.5"/><path d="M12.4 12.4L14.5 14.5"/></svg></button>
        </div>
      </header>
      <div class="cmd" id="cmd" role="toolbar" data-i18n-attr="aria-label:cmd_label">
        <button class="btn" id="c-new" type="button" data-icon="folder-new" aria-haspopup="menu"><span class="lbl" data-i18n="new">New</span></button>
        <span class="vsep"></span>
        <button class="ib" id="c-cut" type="button" data-icon="cut" data-i18n-attr="title:tip_cut;aria-label:cut"></button>
        <button class="ib" id="c-copy" type="button" data-icon="copy" data-i18n-attr="title:tip_copy;aria-label:copy"></button>
        <button class="ib" id="c-paste" type="button" data-icon="paste" data-i18n-attr="title:tip_paste;aria-label:paste"></button>
        <button class="ib" id="c-rename" type="button" data-icon="rename" data-i18n-attr="title:tip_rename;aria-label:rename"></button>
        <button class="ib" id="c-delete" type="button" data-icon="delete" data-i18n-attr="title:tip_delete;aria-label:delete"></button>
        <span class="vsep"></span>
        <button class="btn" id="c-sort" type="button" data-icon="sort" aria-haspopup="menu"><span class="lbl" data-i18n="sort">Sort</span></button>
        <button class="btn" id="c-view" type="button" data-icon="view" aria-haspopup="menu"><span class="lbl" data-i18n="view">View</span></button>
        <span class="sp"></span>
        <button class="btn" id="c-undo" type="button" data-icon="restore" hidden><span class="lbl" data-i18n="undo">Undo</span></button>
        <button class="btn" id="c-tosd" type="button" data-icon="upload" hidden data-i18n-attr="title:tosd_title"><span class="lbl" data-i18n="tosd">To the device</span></button>
        <button class="ib" id="c-preview" type="button" data-icon="eye" aria-pressed="false" data-i18n-attr="title:tip_preview;aria-label:tip_preview"></button>
        <button class="ib" id="c-more" type="button" data-icon="more" aria-haspopup="menu" data-i18n-attr="title:more;aria-label:more"></button>
      </div>
      <div class="searchbar" id="searchbar" hidden role="status"></div>
      <div class="content">
        <div class="listpane">
          <div class="colhead" id="colhead" role="row"></div>
          <div class="list" id="list" role="listbox" tabindex="0" aria-multiselectable="true" data-view="details" data-i18n-attr="aria-label:list_label"></div>
        </div>
        <aside class="preview" id="preview" hidden aria-live="polite" data-i18n-attr="aria-label:tip_preview"></aside>
      </div>
      <footer class="status" role="status"><span id="st-count"></span><span id="st-sel"></span><span class="sp"></span><span id="st-free"></span></footer>
    </main>
  </div>

  <div id="drop" class="drop" hidden>
    <div class="box">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v8M5 7.5l3 3 3-3M3 13h10"/></svg>
      <div data-i18n="drop_here">Drop to upload here</div>
      <div class="dest" id="dropdest"></div>
    </div>
  </div>
  <div id="uploads" class="uploads" hidden role="status">
    <div class="uh"><span id="up-title" data-i18n="uploads_title">Uploads</span><span class="sp"></span><button class="small" id="up-clear" type="button" data-i18n="up_clear">Clear</button></div>
    <div class="body" id="up-body"></div>
  </div>

  <script type="module">
    import I18N from '/nucleo-i18n.js';
    import Caps from '/nucleo-caps.js';
    import fs from '/nucleo-fs.js';
    import os from '/nucleo-shell.js';
    import menu, { ICONS } from '/nucleo-menu.js';
    import pack from '/nucleo-pack.js';
    import { boot } from './js/fm-app.js';
    // The core modules are handed over here, so every module under js/ imports only its neighbours and runs in
    // node for the tests (tests/suite/file-commander-*.test.mjs).
    boot({ I18N, Caps, fs, os, menu, ICONS, pack });
  </script>
</body>
</html>
