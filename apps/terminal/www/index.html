        if (reply) emit(reply); else addLine('(no answer — the offline brain abstained)', 'dim');
        if (j.action && j.action !== 'none') {
          // In a pipeline an action is DATA. A stage that launched an app as a side effect would
          // make `dmesg | anima "…" | tee log` open windows while it wrote a file.
          if (!ctx?.isPipe && j.action === 'launch' && j.arg) {
            addLine('→ launch ' + j.arg, 'ok');
            try { parent.postMessage({ type: 'open-app', id: j.arg }, '*'); } catch {}
          } else addLine(('→ ' + j.action + ' ' + (j.arg || '')).trim(), 'dim');
        }
        if (verbose) addLine(`tier=${j.tier} domain=${j.domain} conf=${j.confidence} trace="${j.trace || ''}"`, 'dim');
      },
      async verify(arg, ctx) {
        const argv = ctx?.argv ? ctx.argv.slice(1) : (String(arg || '').match(/"[^"]*"|\S+/g) || []);
        let kind = '', lang = '';
        const words = [];
        for (let i = 0; i < argv.length; i++) {
          const a = String(argv[i]);
          if (a === '--kind') kind = String(argv[++i] || '');
          else if (a === '-l') lang = String(argv[++i] || '').slice(0, 2);
          else words.push(a.replace(/^"|"$/g, ''));
        }
        if (words.length < 2) { emit('usage: verify <key> <asserted> [--kind fact|numeric] [-l it|en]', 'err'); return; }
        const asserted = words.pop(), key = words.join(' ');
        let url = '/api/anima/verify?key=' + encodeURIComponent(encTrim(key, 100))
          + '&asserted=' + encodeURIComponent(encTrim(asserted, 60));
        if (kind) url += '&kind=' + encodeURIComponent(kind);
        if (lang) url += '&lang=' + encodeURIComponent(lang);
        const j = await devJSON('verify', url);
        if (j) emit(((j.verdict || j.result || 'unknown') + '\t' + (j.evidence || '')).trim());
      },

      // ---- radios and panel (each one widens the manifest — see the report) --
      async wifi(arg, ctx) {
        const argv = ctx?.argv ? ctx.argv.slice(1) : (String(arg || '').match(/"[^"]*"|\S+/g) || []);
        const sub = String(argv[0] || '').toLowerCase();
        const a1 = String(argv[1] || '').replace(/^"|"$/g, '');
        const a2 = String(argv[2] || '').replace(/^"|"$/g, '');
        if (sub === 'scan') {
          // A scan parks the radio for a second or two. It is refused inside watch, and rate
          // limited, because a shell loop over it would knock the device off its own network.
          if (watching) { emit('wifi: scan is a blocking radio operation — not inside watch', 'err'); return; }
          if (Date.now() - lastScanAt < 10000) { emit('wifi: scanned less than 10 s ago — let the radio finish', 'warn'); return; }
          lastScanAt = Date.now();
          const j = await devJSON('wifi', '/api/wifi/scan');

          const nets = j.networks || [];
          for (const n of nets) emit([n.ssid, n.rssi, n.channel, n.auth || ''].join('\t'));
          emit(`${nets.length} network${nets.length === 1 ? '' : 's'}`, 'dim');

        }
        if (sub === 'join') {
          if (!a1) { emit('usage: wifi join <ssid> [password]', 'err'); return; }
          const j = await devPOST('wifi', '/api/wifi/join', { ssid: a1, password: a2 });
          if (j) emit('joining ' + a1 + ' …', 'ok');

        }
        if (sub === 'forget') {
          if (!a1) { emit('usage: wifi forget <ssid>', 'err'); return; }
          const j = await devPOST('wifi', '/api/wifi/forget', { ssid: a1 });
          if (j) emit('forgot ' + a1, 'ok');
          return;
        }
        if (sub === 'prio') {
          if (!a1 || !a2) { emit('usage: wifi prio <ssid> <n>', 'err'); return; }
          const j = await devPOST('wifi', '/api/wifi/priority', { ssid: a1, priority: parseInt(a2) || 0 });
          if (j) emit(`${a1} priority ${a2}`, 'ok');
          return;
        }
        if (sub === 'reconnect') {
          const j = await devPOST('wifi', '/api/wifi/reconnect');
          if (j) emit('reconnecting …', 'ok');
          return;
        }
        emit('usage: wifi scan | known | join <ssid> [pass] | forget <ssid> | prio <ssid> <n> | reconnect', 'err');
      },
      async ir(arg, ctx) {
        const argv = ctx?.argv ? ctx.argv.slice(1) : (String(arg || '').match(/"[^"]*"|\S+/g) || []);
        const sub = String(argv[0] || 'db').toLowerCase();
        if (sub === 'db') {
          const j = await devJSON('ir', '/api/ir/db');
          if (!j) return;
          emit('gpio ' + j.gpio + '  ready ' + (j.ready ? 'yes' : 'no'));

          const [, proto, addr, cmd, rep] = argv;

          const j = await devPOST('ir', '/api/ir/send',

        // it stays in the IR Remote app, where a visible button can stop it.
        if (sub === 'jam') { emit('ir: the jammer is not exposed here — use the IR Remote app, which has a stop button', 'err'); return; }
        emit('usage: ir db | send <proto> <addr> <cmd> [rep] | raw <us,…> | tvbgone start|stop|status', 'err');
      },
      async display(arg) {
        const a = (arg || '').trim().toLowerCase();
        if (a !== 'on' && a !== 'off') { emit('usage: display on | display off', 'err'); return; }
        // The single biggest lever on a 120 mAh budget, and until now only reachable through Settings.
        const j = await devPOST('display', '/api/display', { on: a === 'on' });
        if (j) emit(`display ${j.on === false ? 'off' : 'on'} brightness=${j.brightness == null ? '?' : j.brightness}`, 'ok');
      },
      async screen(arg) {
        const m = (arg || '').match(/-o\s+(\S+)/);
        const outPath = norm((m ? m[1] : '/data/screen.bmp').replace(/^"|"$/g, ''));
        let r;
        try { r = await fetch('/api/screen', { cache: 'no-store' }); }
        catch { emit('screen: cannot reach the device', 'err'); return; }
        if (r.status === 401) { emit('screen: not paired (401)', 'err'); return; }
        if (r.status === 404) { emit('screen: not available on this build (404)', 'warn'); return; }
        if (r.status === 503) { emit('screen: panel size unavailable — try again once the panel is on', 'warn'); return; }
        if (!r.ok) { emit('screen: failed (status ' + r.status + ')', 'err'); return; }

          const w = await api('write', outPath, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: buf });

      },
      async say(arg, ctx) {
        const text = (arg ? String(arg).replace(/^"([\s\S]*)"$/, '$1') : (ctx?.stdin || '')).trim();
        if (!text) { emit('usage: say <text>   (or pipe text into it)', 'err'); return; }
        const j = await devPOST('say', '/api/tts', { say: text.slice(0, 400), lang: (envVars.LANG || 'en').slice(0, 2) });
        if (!j) return;
        if (j.available === false) { emit('say: no speech engine on this device', 'warn'); return; }

      notify(arg, ctx) {
        const text = (arg ? String(arg).replace(/^"([\s\S]*)"$/, '$1') : (ctx?.stdin || '')).trim();
        if (!text) { emit('usage: notify <text>', 'err'); return; }

        // user after they have switched windows.
        try { parent.postMessage({ type: 'nucleo.broker', method: 'notify', id: 'term-' + Date.now(), args: { text: text.slice(0, 200) } }, '*'); }

      clip(arg, ctx) {

        // service here, not a browser one, so it survives a window change.
        if (/(^|\s)-o(\s|$)/.test(arg || '')) {
          return new Promise((resolve) => {
            let done = false;

              if (!e.data || e.data.type !== 'clipboard-data' || done) return;

      clear() { out.innerHTML = ''; lineCount = 0; trimNote = null; unseen = 0; if (pillEl) pillEl.hidden = true; },
    };

    // ---- lexer ------------------------------------------------------------------
    // Operators count only outside quotes, and $VAR is substituted AFTER the split, so an
    // expanded value can never introduce a word break, a quote or a pipe of its own.
    const OPS = ['&&', '||', '>>', '|', '>', '<', ';'];
    function tokenize(line) {
      const toks = [];
      let parts = null, quoted = false;
      const put = (text, expand) => {
        if (!parts) parts = [];
        const last = parts[parts.length - 1];
        if (last && last.expand === expand) last.text += text; else parts.push({ text, expand });
      };
      const flush = () => { if (parts) toks.push({ w: parts, quoted }); parts = null; quoted = false; };
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '\\') {
          if (i + 1 >= line.length) return { error: 'syntax error: unexpected end of input' };
          put(line[++i], false);
        } else if (c === "'") {
          const end = line.indexOf("'", i + 1);
          if (end < 0) return { error: 'syntax error: unterminated quote' };
          quoted = true; put(line.slice(i + 1, end), false); i = end;
        } else if (c === '"') {
          quoted = true; put('', true);
          let j = i + 1, closed = false;
          for (; j < line.length; j++) {
            const d = line[j];
            if (d === '\\' && j + 1 < line.length && '"\\$'.includes(line[j + 1])) { put(line[++j], false); continue; }
            if (d === '"') { closed = true; break; }
            put(d, true);
          }
          if (!closed) return { error: 'syntax error: unterminated quote' };
          i = j;
        } else if (/\s/.test(c)) {
          flush();
        } else {
          const op = OPS.find((o) => line.startsWith(o, i));
          if (op) { flush(); toks.push({ op }); i += op.length - 1; }
          else put(c, true);
        }
      }
      flush();
      return { tokens: toks };
    }

    // An unquoted word that expands to nothing disappears; a quoted one stays as an empty
    // argument. That difference is why the substitution has to know how each part was written.
    function expandWord(tok) {
      let text = '', substituted = false;
      for (const p of tok.w) {
        if (!p.expand) { text += p.text; continue; }
        text += p.text.replace(/\$(?:\{(\w+)\}|(\w+))/g, (_, braced, bare) => {
          substituted = true;
          const v = envVars[braced || bare];
          return v == null ? '' : String(v);
        });
      }
      return { text, drop: text === '' && !tok.quoted && substituted };
    }

    // ---- parser -----------------------------------------------------------------
    // line := pipeline ( (';' | '&&' | '||') pipeline )* ;  pipeline := stage ('|' stage)* ;
    // stage := word+ ( ('>' | '>>' | '<') word )*
    function parse(line) {
      const lex = tokenize(line);
      if (lex.error) return lex;
      const list = [];
      let stages = [], stage = null, redir = null, join = ';';
      const closeStage = () => {
        if (!stage) return null;
        if (!stage.argv.length) return 'syntax error: redirection without a command';
        stages.push(stage); stage = null; return null;
      };
      for (const tk of lex.tokens) {
        if (!tk.op) {
          const w = expandWord(tk);
          if (!stage) stage = { argv: [], redirs: [] };
          if (redir) {
            if (w.drop || !w.text) return { error: 'syntax error: missing redirection target' };
            stage.redirs.push({ op: redir, path: w.text }); redir = null;
          } else if (!w.drop) stage.argv.push(w.text);
          continue;
        }
        if (redir) return { error: `syntax error near '${tk.op}'` };
        if (tk.op === '>' || tk.op === '>>' || tk.op === '<') { redir = tk.op; continue; }
        if (tk.op !== ';' && !stage) return { error: `syntax error near '${tk.op}'` };
        const bad = closeStage();
        if (bad) return { error: bad };
        if (tk.op === '|') continue;
        if (!stages.length) return { error: `syntax error near '${tk.op}'` };
        list.push({ stages, join });
        stages = []; join = tk.op;
      }
      if (redir) return { error: 'syntax error: missing redirection target' };
      const bad = closeStage();
      if (bad) return { error: bad };
      if (stages.length) list.push({ stages, join });
      else if (join !== ';' && list.length) return { error: `syntax error: '${join}' with no command` };
      for (const seg of list) if (seg.stages.length > LIMITS.maxStages)
        return { error: `too many stages in one pipeline (max ${LIMITS.maxStages})` };
      // Aliases expand once, on the command word only. One pass cannot loop on `alias ls='ls -l'`,
      // and refusing an alias body that contains an operator keeps a saved string from smuggling in
      // a pipe or a redirect the user never typed.
      for (const seg of list) for (const st of seg.stages) {
        const body = aliases[st.argv[0]];
        if (!body) continue;
        const lex2 = tokenize(body);
        if (lex2.error || lex2.tokens.some((tk) => tk.op)) continue;
        const words = lex2.tokens.map(expandWord).filter((w) => !w.drop).map((w) => w.text);
        if (words.length) st.argv.splice(0, 1, ...words);
      }
      return { list };
    }

    // ---- executor ----------------------------------------------------------------
    let aborted = false;
    // The 34 commands were written against a raw argument string, so tokens are re-joined for
    // them — re-quoting whatever carries whitespace, which is what makes `cp "$SRC" /data/b`
    // work once $SRC expands to a path with a space in it.
    const quoteArg = (a) => (a === '' || /\s/.test(a)) ? '"' + a + '"' : a;

    async function runStage(stage, stdin, last) {
      const name = stage.argv[0].toLowerCase();
      const outTo = stage.redirs.find((r) => r.op === '>' || r.op === '>>');
      const inFrom = stage.redirs.find((r) => r.op === '<');
      let feed = stdin;
      if (inFrom) {
        const p = norm(inFrom.path);
        let r;
        try { r = await api('read', p); }
        catch { emit(`${name}: cannot reach the file API`, 'err'); return { out: '', code: 1 }; }
        if (!r.ok) { emit(`${name}: cannot read ${p} (status ${r.status})`, 'err'); return { out: '', code: 1 }; }
        feed = (await r.text()).slice(0, LIMITS.maxBytes);
      }
      const capture = !!outTo || !last;
      const buf = []; let bufLen = 0, cut = false;
      const prev = sink;
      if (capture) sink = (s) => {
        if (bufLen + s.length > LIMITS.maxBytes) {
          if (!cut) { cut = true; addLine(`${name}: output truncated at ${fmtBytes(LIMITS.maxBytes)}`, 'warn'); }
          return;
        }
        buf.push(s); bufLen += s.length + 1;
      };
      const before = errors;
      try {
        await COMMANDS[name](stage.argv.slice(1).map(quoteArg).join(' '),
          { stdin: feed, argv: stage.argv, env: envVars, cwd, isPipe: capture });
      } catch (e) { sink = prev; emit(`${name}: ${e?.message || e}`, 'err'); }
      sink = prev;
      let code = errors > before ? 1 : 0;
      if (!outTo) return { out: buf.join('\n'), code };
      const p = norm(outTo.path);
      let body = buf.join('\n');
      if (outTo.op === '>>') {
        try { const r = await api('read', p); if (r.ok) { const old = await r.text(); if (old) body = old.replace(/\n$/, '') + '\n' + body; } } catch {}
      }
      try {
        const w = await api('write', p, { method: 'POST', body });
        if (!w.ok) { emit(`${name}: failed to write ${p} (status ${w.status})`, 'err'); code = 1; }
      } catch { emit(`${name}: failed to write ${p} (file API unavailable)`, 'err'); code = 1; }
      return { out: '', code };
    }

    async function runPipeline(stages) {
      for (const st of stages) {
        // Reject the whole pipeline up front: a typo in stage 3 must not cost stage 1 a request.
        const nm = st.argv[0].toLowerCase();
        if (!COMMANDS[nm]) { emit(nm + ': command not found — type "help"', 'err'); return 1; }
      }
      let data = null, code = 0;
      for (let i = 0; i < stages.length; i++) {
        if (aborted) return 130;
        const r = await runStage(stages[i], data, i === stages.length - 1);
        code = r.code;
        if (code !== 0) return code;      // pipefail: a dead pipe must not fire further requests
        data = r.out;
      }
      return code;
    }

    // ---- runner ----------------------------------------------------------------
    // exec() is run() without the prompt echo and without clearing the abort token — which is what
    // `watch` needs to re-run a line every few seconds and still stop on Ctrl+C.
    async function exec(cmd) {
      const p = parse(cmd);
      if (p.error) { emit(p.error, 'err'); return 2; }
      let code = 0;
      for (const seg of p.list) {
        if (aborted) break;
        if (seg.join === '&&' && code !== 0) continue;
        if (seg.join === '||' && code === 0) continue;
        code = await runPipeline(seg.stages);
      }
      return code;
    }
    async function run(raw) {
      const cmd = raw.trim();
      // One echo per submitted line, not per stage — and it is tappable, which on a touchscreen is
      // the fastest recall there is: point at a command you ran, get it back in the input.
      emit(cwd + ' $ ' + cmd, 'cmd', cmd ? { kind: 'cmd', name: cmd } : null);
      if (!cmd) return 0;
      aborted = false;
      return exec(cmd);
    }

    // ---- directory cache for completion -----------------------------------------
    // A listing costs the device one stat() per entry plus a subdirectory scan, built into cJSON in
    // an 18 KB heap — so it is the expensive call, and Tab is the thing that would repeat it. The
    // cache is generous where memory is free (24 directories, ~3 KB each, in the browser) and stingy
    // where it is not: one request per directory per 20 s, single-flight, and never two at a time.
    const CDIR = { map: new Map(), inflight: new Map() };
    const CACHE_TTL = 20000, CACHE_NEG_TTL = 5000, CACHE_MAX = 24;
    let listBusy = false, procNodes = null;
    function cacheGet(dir) {
      const e = CDIR.map.get(dir);
      if (!e) return null;
      if (Date.now() - e.at > (e.neg ? CACHE_NEG_TTL : CACHE_TTL)) { CDIR.map.delete(dir); return null; }
      CDIR.map.delete(dir); CDIR.map.set(dir, e);      // Map insertion order IS the LRU order
      return e;
    }
    function cachePut(dir, entries, neg) {
      CDIR.map.delete(dir);
      CDIR.map.set(dir, { entries, at: Date.now(), neg: !!neg });
      while (CDIR.map.size > CACHE_MAX) CDIR.map.delete(CDIR.map.keys().next().value);
    }
    // Explicit invalidation beats a short TTL: it is exact, and it costs the device nothing.
    function cacheDrop(path) {
      if (!path) { CDIR.map.clear(); return; }
      CDIR.map.delete(path);
      CDIR.map.delete(path.replace(/\/[^/]*$/, '') || '/');
    }
    async function warmDir(dir) {
      if (cacheGet(dir)) return null;
      if (CDIR.inflight.has(dir)) return CDIR.inflight.get(dir);
      if (listBusy) return 'busy';        // one completion listing at a time: the shell needs the sockets
      listBusy = true;
      const job = (async () => {
        await null;                       // suspend before any work, so the inflight entry lands first
        try {
          const r = await api('list', dir);
          // A 401 is never cached: pairing can happen at any moment, and a remembered 401 would
          // leave the terminal looking broken for twenty seconds after the user fixed it.
          if (r.status === 401) return '401';
          if (!r.ok) { cachePut(dir, [], true); return null; }
          const j = await r.json();
          cachePut(dir, (j.entries || []).map((e) => ({ name: e.name, type: e.type })), false);
          return null;
        } catch { return 'net'; }
        finally { CDIR.inflight.delete(dir); listBusy = false; }
      })();
      CDIR.inflight.set(dir, job);
      return job;
    }
    // /proc is a fixed firmware table that cannot change without a reboot, so it is fetched once.
    async function warmProc() {
      if (procNodes) return;
      try {
        const r = await fetch('/proc', { cache: 'no-store' });
        if (!r.ok) return;
        procNodes = (await r.text()).split(/\n/).filter(Boolean).map((n) => ({ name: n, type: 'file' }));
      } catch {}
    }

    // ---- completion (pure: it reads the cache and never the wire) -----------------
    // Most commands take no path at all, and the table below is why: the device is asked for a
    // listing only when the fragment under the caret is genuinely pointing at the filesystem.
    // One letter per argument position, the last one repeating — d dirs, f files first, p both,
    // '-' nothing.
    const PATHRULE = {
      cd: 'd', mkdir: 'd', du: 'd', tree: 'd',
      ls: 'p', rm: 'p', stat: 'p', find: 'p', cp: 'pp', mv: 'pp',
      cat: 'f', wc: 'f', open: 'f', touch: 'f', head: 'f', tail: 'f',
      hexdump: 'f', base64: 'f', tee: 'f', grep: '-f', wget: '-f', screen: '-f',
    };
    const WORDRULE = {
      help: ['files', 'text', 'system', 'anima', 'radios', 'shell'],
      theme: ['dark', 'light'], uname: ['-a'], history: ['clear', '10', '20', '50'],
      anima: ['--caps', '--l1', '--reset', '-o', '-l', '-v'],
      wifi: ['scan', 'known', 'join', 'forget', 'prio', 'reconnect'],
      ir: ['db', 'send', 'raw', 'tvbgone'], display: ['on', 'off'], ota: ['status'],
      apps: ['open', '-a'], lang: ['it', 'en', 'fr', 'es', 'de'], link: ['peers', 'status'],
      sort: ['-r', '-n', '-u', '-k'], uniq: ['-c'], clip: ['-o'], base64: ['-d'],
      dmesg: ['-l'], date: ['-u', '-s'], du: ['-d'], tree: ['-L'], cut: ['-d', '-f', '-c'],
      hexdump: ['-n', '-s'], head: ['-n'], tail: ['-n'], find: ['-name'], watch: ['-n', '-c'],
    };
    const URLCMD = { curl: 1, wget: 1, ping: 1 };
    const SEP = { '|': 1, ';': 1, '&&': 1, '||': 1 };
    const REDIR = { '>': 1, '>>': 1, '<': 1 };

    // A second, offset-preserving split: the shell tokeniser throws positions away, and completion
    // is nothing but positions.
    function ctokens(line) {
      const toks = []; let cur = null, q = false;
      const close = (i) => { if (cur) { cur.end = i; toks.push(cur); cur = null; } };
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { if (!cur) cur = { start: i, text: '', quoted: true }; else cur.quoted = true; q = !q; continue; }
        if (!q && /\s/.test(c)) { close(i); continue; }
        if (!cur) cur = { start: i, text: '', quoted: false };
        cur.text += c;
      }
      close(line.length);
      return toks;
    }
    const lcp = (arr) => {
      let p = arr[0] || '';
      for (const s of arr) { let i = 0; while (i < p.length && i < s.length && p[i] === s[i]) i++; p = p.slice(0, i); }
      return p;
    };
    const cmdNames = () => Object.keys(COMMANDS).concat(Object.keys(aliases)).sort();

    function completions(line, caret) {
      const toks = ctokens(line);
      let idx = toks.findIndex((t) => caret >= t.start && caret <= t.end);
      let tok;
      if (idx < 0) {
        tok = { start: caret, end: caret, text: '', quoted: false };
        idx = toks.filter((t) => t.end <= caret).length;
        toks.splice(idx, 0, tok);
      } else tok = toks[idx];
      let cmdIdx = 0;
      for (let i = idx - 1; i >= 0; i--) if (!toks[i].quoted && SEP[toks[i].text]) { cmdIdx = i + 1; break; }
      const prev = idx > 0 ? toks[idx - 1] : null;
      const afterRedir = !!(prev && !prev.quoted && REDIR[prev.text]);
      const name = (toks[cmdIdx] || {}).text || '';
      const frag = tok.text;
      const res = { start: tok.start, end: tok.end, frag, kind: 'word', items: [], pending: null };

      if (idx === cmdIdx && !afterRedir) {
        res.kind = 'command';
        res.items = cmdNames().filter((n) => n.startsWith(frag)).map((n) => ({ text: n, kind: 'command', display: n }));
        return res;
      }
      const ai = idx - cmdIdx;
      if (!afterRedir) {
        // Nobody retypes a URL on a 56-key keyboard, and every URL worth completing was already
        // typed once — so this is history, not a request.
        if (URLCMD[name] && ai === 1) {
          const seen = new Set(), hits = [];
          for (let i = hist.length - 1; i >= 0 && hits.length < 20; i--) {
            const w = ctokens(hist[i]);
            if (!w.length || w[0].text !== name) continue;
            for (const t of w.slice(1)) {
              if (t.text.startsWith('-') || seen.has(t.text) || !t.text.startsWith(frag)) continue;
              seen.add(t.text); hits.push({ text: t.text, kind: 'url', display: t.text });
            }
          }
          if (hits.length) { res.kind = 'url'; res.items = hits; return res; }
        }
        if (name === 'unalias' && ai === 1) {
          res.items = Object.keys(aliases).filter((n) => n.startsWith(frag)).sort().map((n) => ({ text: n, kind: 'word', display: n }));
          return res;
        }
        if (name === 'export' && ai === 1) {
          res.items = Object.keys(envVars).filter((n) => n.startsWith(frag)).sort().map((n) => ({ text: n + '=', kind: 'word', display: n + '=' }));
          return res;
        }
        if ((name === 'man' || name === 'which' || name === 'watch') && ai === 1) {
          res.kind = 'command';
          res.items = cmdNames().filter((n) => n.startsWith(frag)).map((n) => ({ text: n, kind: 'command', display: n }));
          return res;
        }
        const words = WORDRULE[name];
        if (words) {
          const hits = words.filter((w) => w.startsWith(frag));
          if (hits.length && (frag || ai === 1)) {
            res.items = hits.map((w) => ({ text: w, kind: 'word', display: w }));
            return res;
          }
        }
      }
      let rule = afterRedir ? 'f' : '';
      if (!rule) {
        const spec = PATHRULE[name] || '';
        rule = spec ? spec.charAt(Math.min(ai - 1, spec.length - 1)) : '';
        // An unknown command still completes a fragment that is obviously a path: the user pointed
        // at the filesystem, which is the only condition this whole design cares about.
        if ((!rule || rule === '-') && /^\.{0,2}\//.test(frag)) rule = 'p';
      }
      if (!rule || rule === '-') return res;

      const slash = frag.lastIndexOf('/');
      const dirPart = slash < 0 ? '' : frag.slice(0, slash + 1);
      const leaf = slash < 0 ? frag : frag.slice(slash + 1);
      const baseDir = norm(dirPart || '.');
      res.kind = rule === 'd' ? 'dir' : 'file';
      let entries;
      if (baseDir === '/proc') entries = procNodes;
      else if (baseDir.startsWith('/proc/')) entries = [];        // nothing lives below a /proc node
      else { const c = cacheGet(baseDir); entries = c ? c.entries : null; }
      if (!entries) { res.pending = baseDir; return res; }
      let hits = entries.filter((e) => e.name.startsWith(leaf));
      // The SD is FAT, which is case-insensitive. Pretending otherwise is a lie the user pays for.
      if (!hits.length && leaf) hits = entries.filter((e) => e.name.toLowerCase().startsWith(leaf.toLowerCase()));
      if (rule === 'd') hits = hits.filter((e) => e.type === 'dir');
      hits = hits.slice().sort((a, b) => a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1);
      res.items = hits.map((e) => ({
        text: dirPart + e.name + (e.type === 'dir' ? '/' : ''),
        kind: e.type === 'dir' ? 'dir' : 'file',
        display: e.name + (e.type === 'dir' ? '/' : ''),
      }));
      return res;
    }
    // A directory gets no trailing space, so the next Tab descends into it instead of starting a
    // new argument. Everything else gets one, because the argument is finished.
    function applyCompletion(line, res, index) {
      const it = res.items[index];
      if (!it) return { line, caret: res.end };
      const ins = (/\s/.test(it.text) ? '"' + it.text + '"' : it.text) + (it.kind === 'dir' ? '' : ' ');
      return { line: line.slice(0, res.start) + ins + line.slice(res.end), caret: res.start + ins.length };
    }

    // ---- the strip: completion candidates and history matches share one row -------
    let stripState = null;
    const clearT = (id) => { if (id && typeof clearTimeout === 'function') clearTimeout(id); };
    function stripHide() {
      stripState = null;
      if (!stripEl) return;
      stripEl.hidden = true;
      try { stripEl.innerHTML = ''; } catch {}
    }
    function stripPaint(label, items, sel, extraCls) {
      if (!stripEl || typeof stripEl.appendChild !== 'function') return;
      try { stripEl.innerHTML = ''; } catch {}
      stripEl.hidden = false;
      const tag = document.createElement('span');
      tag.className = 'k'; tag.textContent = label;
      stripEl.appendChild(tag);
      // Nine is the whole quick-select alphabet on this keyboard; a tenth chip could not be reached
      // by a digit anyway, so the slot is spent on an honest count instead.
      const shown = items.slice(0, items.length > 9 ? 8 : 9);
      shown.forEach((it, i) => {
        const el = document.createElement('span');
        el.className = 'c' + (it.kind === 'dir' ? ' d' : '') + (i === sel ? ' on' : '') + (extraCls ? ' ' + extraCls : '');
        const n = document.createElement('span');
        n.className = 'n'; n.textContent = String(i + 1);
        el.appendChild(n);
        const nm = document.createElement('span');
        nm.textContent = ellipsis(it.display || it.text);
        el.appendChild(nm);
        el.addEventListener('click', () => pickChip(i));
        stripEl.appendChild(el);
        if (i === sel && typeof el.scrollIntoView === 'function') el.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      });
      if (items.length > 9) {
        const more = document.createElement('span');
        more.className = 'c more'; more.textContent = '+' + (items.length - 8);
        more.addEventListener('click', () => listAll());
        stripEl.appendChild(more);
      }
    }
    // Head and extension both carry meaning; the middle of a long name does not.
    function ellipsis(s) {
      if (s.length <= 18) return ' ' + s;
      return ' ' + s.slice(0, 9) + '…' + s.slice(-8);
    }
    function stripNote(text, cls) {
      if (!stripEl || typeof stripEl.appendChild !== 'function') return;
      try { stripEl.innerHTML = ''; } catch {}
      stripEl.hidden = false;
      const tag = document.createElement('span');
      tag.className = 'c ' + (cls || 'bad'); tag.textContent = text;
      stripEl.appendChild(tag);
      // No auto-hide: a 1.2 s flash is easy to miss on a phone, and the next keystroke or the next
      // Tab replaces the note anyway. It costs one row, and only after something actually failed.
    }
    function setInput(v, caret) {
      input.value = v;
      if (typeof input.setSelectionRange === 'function') { try { input.setSelectionRange(caret, caret); } catch {} }
      paintGhost();
    }
    function pickChip(i) {
      if (!stripState) return;
      if (stripState.mode === 'search') { stripState.sel = i; searchPaint(); searchEnd(false); return; }
      selectChip(i);
      stripHide();
      if (typeof input.focus === 'function') input.focus();
    }
    // The only place a long candidate list is allowed to spend vertical space — and only because
    // the user asked for it, with one key. It is one line, so the scrollback cap barely notices.
    function listAll() {
      if (!stripState || stripState.mode !== 'complete') return;
      addLine(stripState.res.items.map((i) => i.display || i.text).join('  '), 'dim');
      stripHide();
    }
    function selectChip(i) {
      const s = stripState;
      if (!s || s.mode !== 'complete') return;
      const n = s.res.items.length;
      s.sel = ((i % n) + n) % n;
      const a = applyCompletion(s.line, s.res, s.sel);   // preview: the candidate lands in the input
      setInput(a.line, a.caret);
      stripPaint(s.res.kind === 'command' ? 'cmd' : s.res.kind === 'url' ? 'url' : s.res.kind === 'dir' ? 'dir' : 'file',
        s.res.items, s.sel);
    }

    let completing = false;
    async function doComplete(delta) {
      if (completing) return;
      if (stripState && stripState.mode === 'complete') { selectChip(stripState.sel + (delta || 1)); return; }
      completing = true;
      try {
        const line = input.value;
        const caret = typeof input.selectionStart === 'number' ? input.selectionStart : line.length;
        let res = completions(line, caret);
        if (res.pending) {
          if (res.pending === '/proc') await warmProc();
          else {
            stripNote('…', 'more');
            const err = await warmDir(res.pending);
            if (err === '401') { stripNote('not paired (401)'); return; }
            if (err === 'net') { stripNote('device unreachable'); return; }
          }
          res = completions(line, caret);
          if (res.pending) { stripHide(); return; }
        }
        // A failed Tab never writes to the transcript: a console that scrolls when completion
        // misses is exactly the flooding this whole design exists to avoid.
        if (!res.items.length) { stripNote('no match'); return; }
        if (res.items.length === 1) {
          const a = applyCompletion(line, res, 0);
          setInput(a.line, a.caret);
          stripHide();
          return;
        }
        const common = lcp(res.items.map((i) => i.text));
        let cur = line, curCaret = caret;
        if (common.length > res.frag.length) {
          cur = line.slice(0, res.start) + common + line.slice(res.end);
          curCaret = res.start + common.length;
          setInput(cur, curCaret);
          const again = completions(cur, curCaret);
          if (!again.pending && again.items.length > 1) res = again;
        }
        stripState = { mode: 'complete', res, sel: -1, line: cur, caret: curCaret };
        selectChip(delta < 0 ? res.items.length - 1 : 0);
      } finally { completing = false; }
    }

    // ---- reverse history search (Ctrl+R) ------------------------------------------
    // Bash shows one match at a time. Nine numbered chips is strictly better on a keyboard this
    // small, and it reuses the strip rather than inventing a second surface.
    function searchStart() {
      const saved = input.value;
      stripState = { mode: 'search', q: '', saved, sel: 0, matches: [] };
      searchPaint();
    }
    function searchPaint() {
      const s = stripState;
      if (!s || s.mode !== 'search') return;
      const q = s.q.toLowerCase(), seen = new Set(), m = [];
      for (let i = hist.length - 1; i >= 0 && m.length < 200; i--) {
        const h = hist[i];
        if (q && !h.toLowerCase().includes(q)) continue;
        if (seen.has(h)) continue;
        seen.add(h); m.push({ text: h, kind: 'word', display: h });
      }
      s.matches = m;
      if (s.sel >= m.length) s.sel = 0;
      const label = '(r-search: ' + s.q + ')';
      psEl.className = 'ps search';
      psEl.textContent = label.length > 22 ? '(r-search: …' + s.q.slice(-12) + ')' : label;
      const val = m.length ? m[s.sel].text : s.saved;
      setInput(val, val.length);
      if (m.length) stripPaint('hist', m, s.sel);
      else stripNote('no match');
    }
    function searchEnd(restore) {
      const s = stripState;
      psEl.className = 'ps'; psEl.textContent = cwd + ' $';
      if (s && restore) setInput(s.saved, s.saved.length);
      stripHide();
    }

    // ---- ghost suggestion ---------------------------------------------------------
    // Never issues a request. That is the whole guarantee: typing costs the device nothing, so the
    // suggestion is only ever as good as what is already in the browser — which is enough.
    let ghostTimer = 0, ghostFull = '';
    function ghostFor(v) {
      for (let i = hist.length - 1; i >= 0; i--) if (hist[i] !== v && hist[i].startsWith(v)) return hist[i];
      if (!/\s/.test(v)) {
        const n = cmdNames().find((c) => c !== v && c.startsWith(v));
        if (n) return n;
      }
      const res = completions(v, v.length);
      if (!res.pending && res.items.length === 1) return v.slice(0, res.start) + res.items[0].text;
      return '';
    }
    function paintGhost() {
      if (!ghA || !ghB) return;
      const v = input.value;
      const atEnd = typeof input.selectionStart !== 'number' || input.selectionStart === v.length;
      let full = '';
      try { if (v && atEnd && !stripState) full = ghostFor(v); } catch {}
      ghostFull = (full && full.startsWith(v) && full !== v) ? full : '';
      ghA.textContent = ghostFull ? v : '';
      ghB.textContent = ghostFull ? ghostFull.slice(v.length) : '';
    }
    function scheduleGhost() {
      clearT(ghostTimer);
      ghostTimer = setTimeout(paintGhost, 160);
    }
    function acceptGhost() {
      if (!ghostFull) return false;
      setInput(ghostFull, ghostFull.length);
      return true;
    }

    // ---- persistence: history, aliases, resume ------------------------------------
    // /api/fs/write has no append mode, so the file is rewritten from a bounded in-memory list.
    // Flushing is batched (10 commands or 30 s) and always happens when the window goes away —
    // worst case one 8 KB write per 30 s while actively typing, and nothing at all while idle.
    const hist = []; let hi = -1;
    const HIST_MAX = 200, HIST_BATCH = 10, HIST_IDLE = 30000;
    let histNew = 0, histFirstAt = 0, histTimer = 0, histNoted = false, histLoaded = false;
    function remember(line) {
      if (!line.trim() || line.startsWith(' ')) return;   // a leading space keeps a line off the SD
      const at = hist.indexOf(line);
      if (at >= 0) hist.splice(at, 1);                    // a repeat moves to the end, never duplicates
      hist.push(line);
      while (hist.length > HIST_MAX) hist.shift();
      histNew++;
      if (!histFirstAt) histFirstAt = Date.now();
      if (histNew >= HIST_BATCH || Date.now() - histFirstAt >= HIST_IDLE) saveHistory(false);
      else { clearT(histTimer); histTimer = setTimeout(() => saveHistory(false), HIST_IDLE); }
    }
    async function writeApp(path, body, keepalive) {
      const opts = { method: 'POST', body };
      if (keepalive) opts.keepalive = true;
      let r;
      try { r = await api('write', path, opts); } catch { return false; }
      if (r.ok) return true;
      // The app's own mount is created on first use: nothing ships it on the SD image.
      if (r.status === 404) {
        try {
          await fetch('/api/fs/mkdir?path=' + encodeURIComponent(APPDIR), { method: 'POST' });
          const again = await api('write', path, opts);
          return !!(again && again.ok);
        } catch { return false; }
      }
      if (r.status === 401 && !histNoted) {
        histNoted = true;
        addLine(t('hist_unpaired'), 'dim');
      }
      return false;
    }
    async function saveHistory(keepalive) {
      if (!histLoaded) return;
      clearT(histTimer); histTimer = 0; histNew = 0; histFirstAt = 0;
      await writeApp(APPDIR + '/history.jsonl', hist.map((h) => JSON.stringify(h)).join('\n'), keepalive);
    }
    async function saveAliases() {
      await writeApp(APPDIR + '/aliases.json', JSON.stringify(aliases));
    }
    async function saveState() {
      await writeApp(APPDIR + '/state.json', JSON.stringify({ cwd, fs: fontStep }));
    }
    async function loadPersisted() {
      // One JSON line per entry, so a truncated tail costs one command and not the file.
      let r = null;
      try { r = await api('read', APPDIR + '/history.jsonl'); } catch {}
      if (r && r.ok) {
        for (const ln of (await r.text()).split(/\r?\n/)) {
          if (!ln.trim()) continue;
          try { const v = JSON.parse(ln); if (typeof v === 'string') hist.push(v); } catch {}
        }
        while (hist.length > HIST_MAX) hist.shift();
      } else if (r && r.status === 401 && !histNoted) {
        histNoted = true;
        addLine(t('hist_unpaired'), 'dim');
      }
      hi = hist.length;
      histLoaded = true;
      const al = await readJSON(APPDIR + '/aliases.json');
      if (al && typeof al === 'object') for (const [k, v] of Object.entries(al)) if (typeof v === 'string') aliases[k] = v;
      const st = await readJSON(APPDIR + '/state.json');
      if (st && typeof st.fs === 'number') setFont(st.fs);
      // Resuming the working directory costs one listing that also warms the cache, so the first
      // Tab of the session is free.
      if (st && typeof st.cwd === 'string' && st.cwd !== '/') {
        const err = await warmDir(st.cwd);
        if (!err && cacheGet(st.cwd)) setCwd(st.cwd);
      }
    }

    // ---- font size ----------------------------------------------------------------
    const FONTS = [13, 15, 17, 20];
    let fontStep = 1;
    function setFont(step) {
      fontStep = Math.max(0, Math.min(FONTS.length - 1, step));
      const root = document.documentElement;
      if (root && root.style && typeof root.style.setProperty === 'function') root.style.setProperty('--fs', FONTS[fontStep] + 'px');
    }

    // ---- submission ----------------------------------------------------------------
    let composing = false, lastSubmit = 0, busy = false;
    const queue = [];

    // "Enter" is not a portable signal. Desktop keyboards send keydown Enter; many mobile IMEs
    // send only beforeinput/insertLineBreak, or keydown 229 while a word is still composing;
    // dictation sends no key event at all. So four routes feed one guarded entry point, and the
    // <form> exists mainly so the on-screen keyboard offers a Go key in the first place.
    function submit() {
      if (composing) return false;
      const now = Date.now();
      if (now - lastSubmit < LIMITS.submitDebounceMs) return false;   // second signal, same gesture
      // Refuse before touching the input, so a rejected line stays where the user can see it.
      if (queue.length >= LIMITS.maxQueued) { emit('shell: too many commands queued', 'warn'); return false; }
      lastSubmit = now;
      const raw = input.value;
      const nl = raw.search(/[\r\n]/);
      const line = nl < 0 ? raw : raw.slice(0, nl);
      input.value = nl < 0 ? '' : raw.slice(nl).replace(/^[\r\n]+/, '');
      remember(line);
      hi = hist.length;
      stripHide();
      paintGhost();
      queue.push(line);
      drain();
      return true;
    }
    // Submitted lines run one at a time: `sink` and `cwd` are shared state, and two lines racing
    // would also double the number of sockets in flight on a device that has four.
    async function drain() {
      if (busy) return;
      busy = true;
      try {
        while (queue.length) {
          const line = queue.shift();
          try { await run(line); }
          catch (e) { emit('shell: ' + (e?.message || e), 'err'); }
          // A command that changed the SD makes the cached listing wrong; dropping the two
          // directories it could have touched is exact, and cheaper than a shorter TTL.
          const w = ctokens(line);
          if (w.length > 1 && /^(mkdir|touch|rm|cp|mv|tee|wget|screen)$/.test(w[0].text))
            for (const tk of w.slice(1)) if (!tk.text.startsWith('-')) cacheDrop(norm(tk.text));
        }
      } finally { busy = false; }
    }

    const caretToEnd = () => {
      const place = () => input.setSelectionRange?.(input.value.length, input.value.length);
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(place); else place();
    };
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });
    input.addEventListener('beforeinput', (e) => {
      if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { e.preventDefault(); submit(); }
    });
    input.addEventListener('input', (e) => {
      if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { submit(); return; }
      if (/[\r\n]/.test(input.value)) { submit(); return; }   // a pasted or dictated line arrives with its newline
      if (!stripState || stripState.mode === 'complete') stripHide();
      scheduleGhost();
    });
    document.getElementById('cmdform').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
    document.getElementById('run').addEventListener('click', (e) => { e.preventDefault(); submit(); input.focus(); });

    // ---- keys ------------------------------------------------------------------------
    // Digits are intercepted only while the strip is open: `head -n 5` has to keep working.
    function stripKeys(e) {
      const s = stripState;
      if (!s) return false;
      const k = e.key || '';
      if (s.mode === 'search') {
        if (k === 'Escape' || (k === 'g' && e.ctrlKey)) { e.preventDefault(); searchEnd(true); return true; }
        if (k === 'Enter') { e.preventDefault(); searchEnd(false); return true; }
        if (k === 'ArrowLeft' || k === 'ArrowRight') { searchEnd(false); return true; }
        if ((k === 'r' && e.ctrlKey) || k === 'Tab' || k === 'ArrowUp') { e.preventDefault(); s.sel++; searchPaint(); return true; }
        if ((k === 's' && e.ctrlKey) || k === 'ArrowDown') { e.preventDefault(); s.sel = Math.max(0, s.sel - 1); searchPaint(); return true; }
        if (/^[1-9]$/.test(k)) { e.preventDefault(); pickChip(parseInt(k) - 1); return true; }
        if (k === 'Backspace') { e.preventDefault(); s.q = s.q.slice(0, -1); searchPaint(); return true; }
        if (k.length === 1 && !e.ctrlKey && !e.metaKey) { e.preventDefault(); s.q += k; searchPaint(); return true; }
        return false;
      }
      if (k === 'Escape') { e.preventDefault(); setInput(s.line, s.caret); stripHide(); return true; }
      // Enter accepts the previewed chip and closes WITHOUT running. On a cramped keyboard an
      // accidental run right after a completion is expensive; one extra keystroke is not.
      if (k === 'Enter') { e.preventDefault(); stripHide(); return true; }
      if (k === 'Tab' || k === 'ArrowRight') { e.preventDefault(); selectChip(s.sel + (e.shiftKey ? -1 : 1)); return true; }
      if (k === 'ArrowLeft') { e.preventDefault(); selectChip(s.sel - 1); return true; }
      if (/^[1-9]$/.test(k)) { e.preventDefault(); pickChip(parseInt(k) - 1); return true; }
      if (k === '0') { e.preventDefault(); listAll(); return true; }
      if (k.length === 1) stripHide();      // any other printable narrows the fragment
      return false;
    }
    function delRange(from, to) {
      const v = input.value;
      setInput(v.slice(0, from) + v.slice(to), from);
    }
    input.addEventListener('keydown', (e) => {
      if (stripKeys(e)) return;
      const k = e.key || '';
      const v = input.value;
      const caret = typeof input.selectionStart === 'number' ? input.selectionStart : v.length;
      const collapsed = input.selectionStart === input.selectionEnd;
      if (k === 'Enter') {
        // keyCode 229 / isComposing means the IME is still assembling a word, not sending a line
        if (e.isComposing || e.keyCode === 229 || e.shiftKey) return;
        e.preventDefault(); submit();
      } else if (k === 'Tab') {
        e.preventDefault(); doComplete(e.shiftKey ? -1 : 1);
      } else if (k === 'ArrowUp') {
        if (hi > 0) { hi--; input.value = hist[hi]; e.preventDefault(); caretToEnd(); paintGhost(); }
      } else if (k === 'ArrowDown') {
        if (hi < hist.length - 1) { hi++; input.value = hist[hi]; }
        else { hi = hist.length; input.value = ''; }
        e.preventDefault(); paintGhost();
      } else if (k === 'ArrowRight' && caret === v.length && collapsed && ghostFull) {
        if (acceptGhost()) e.preventDefault();
      } else if (e.ctrlKey && (k === 'f' || k === 'F')) {
        if (acceptGhost()) e.preventDefault();
      } else if (e.ctrlKey && (k === 'r' || k === 'R')) {
        e.preventDefault(); searchStart();          // the browser's reload has to lose this one
      } else if (e.ctrlKey && (k === 'l' || k === 'L')) {
        e.preventDefault(); COMMANDS.clear();
      } else if (e.ctrlKey && e.shiftKey && (k === 'c' || k === 'C')) {
        e.preventDefault(); copySelection();
      } else if (e.ctrlKey && (k === 'c' || k === 'C')) {
        if (busy || queue.length) { e.preventDefault(); aborted = true; queue.length = 0; emit('^C', 'warn'); }
        else if (v && collapsed) { e.preventDefault(); setInput('', 0); }
      } else if (e.ctrlKey && (k === 'u' || k === 'U')) {
        e.preventDefault(); delRange(0, caret);
      } else if (e.ctrlKey && (k === 'k' || k === 'K')) {
        e.preventDefault(); setInput(v.slice(0, caret), caret);
      } else if (e.ctrlKey && (k === 'w' || k === 'W')) {
        e.preventDefault();
        const head = v.slice(0, caret).replace(/\s*\S+$/, '');
        delRange(head.length, caret);
      } else if (e.ctrlKey && (k === 'a' || k === 'A')) {
        // Only when there is something to move through, so the browser keeps select-all otherwise.
        if (v && collapsed) { e.preventDefault(); input.setSelectionRange?.(0, 0); }
      } else if (e.ctrlKey && (k === 'e' || k === 'E')) {
        e.preventDefault(); input.setSelectionRange?.(v.length, v.length);
      } else if (e.ctrlKey && (k === 'd' || k === 'D')) {
        e.preventDefault();
        if (!v) emit('there is no exit — close the window instead', 'dim');
        else delRange(caret, Math.min(caret + 1, v.length));
      } else if (e.ctrlKey && (k === '-' || k === '_')) {
        e.preventDefault(); setFont(fontStep - 1); saveState();
      } else if (e.ctrlKey && (k === '=' || k === '+')) {
        e.preventDefault(); setFont(fontStep + 1); saveState();
      } else if (k === 'Escape') {
        // Never closes the app: the shell owns that, and losing a half-typed line to a stray Esc
        // on a device with no undo is not a trade worth making twice.
        if (v) { e.preventDefault(); setInput('', 0); }
      }
    });
    document.getElementById('clr').onclick = () => { COMMANDS.clear(); input.focus(); };

    // ---- copying, and pointing at the output -----------------------------------------
    function selectionText() {
      try { return (typeof window.getSelection === 'function' ? String(window.getSelection()) : ''); } catch { return ''; }
    }
    function copySelection() {
      let text = selectionText();
      if (!text) text = out.innerText || out.textContent || '';
      if (!text) return;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text); addLine(t('copy_ok'), 'dim'); return; }
      } catch {}
      // Some device browsers still have no async clipboard, and a copy that silently does nothing
      // is worse than none: the textarea route is the one that works everywhere.
      try {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        addLine(t('copy_ok'), 'dim');
      } catch { addLine(t('copy_fail'), 'warn'); }
    }
    let pressTimer = 0;
    function lineOf(node) {
      let el = node;
      while (el && el !== out && !(el.className && String(el.className).indexOf('line') === 0)) el = el.parentNode;
      return el && el !== out ? el : null;
    }
    out.addEventListener('pointerdown', (e) => {
      clearT(pressTimer);
      const el = lineOf(e.target);
      if (!el) return;
      // A long press selects the whole line so the phone's own drag handles can take over from
      // there; picking one path out of wrapped monospace with a thumb is otherwise miserable.
      pressTimer = setTimeout(() => {
        try {
          const sel = window.getSelection();
          sel.removeAllRanges();
          const r = document.createRange();
          r.selectNodeContents(el);
          sel.addRange(r);
        } catch {}
      }, 500);
    });
    out.addEventListener('pointerup', (e) => {
      clearT(pressTimer);
      // Focusing on every click is what made the transcript uncopyable: it collapsed the selection
      // the user had just made. Focus only when there is nothing selected.
      if (selectionText()) return;
      const el = lineOf(e.target);
      const tap = el && el.__tap;
      if (tap) {
        if (tap.kind === 'cmd') setInput(tap.name, tap.name.length);
        else if (tap.kind === 'dir') setInput('cd ' + tap.name, ('cd ' + tap.name).length);
        else {
          const v = input.value;
          const add = (v && !/\s$/.test(v) ? ' ' : '') + tap.name;
          setInput(v + add, (v + add).length);
        }
      }
      if (typeof input.focus === 'function') input.focus();
    });
    if (pillEl && typeof pillEl.addEventListener === 'function') pillEl.addEventListener('click', toBottom);
    out.addEventListener('scroll', () => { if (atBottom()) { unseen = 0; if (pillEl) pillEl.hidden = true; } });

    // ---- the on-screen key row --------------------------------------------------------
    const keysEl = document.getElementById('keys');
    if (keysEl && typeof keysEl.addEventListener === 'function') keysEl.addEventListener('click', (e) => {
      const b = e.target && e.target.closest ? e.target.closest('button') : null;
      if (!b) return;
      e.preventDefault();
      const k = b.getAttribute('data-k');
      if (k === 'tab') doComplete(1);
      else if (k === 'search') searchStart();
      else if (k === 'up') input.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: false }));
      else if (k === 'down') input.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: false }));
      else if (k === 'abort') { if (busy || queue.length) { aborted = true; queue.length = 0; emit('^C', 'warn'); } else setInput('', 0); }
      else if (k === 'esc') { if (stripState) { if (stripState.mode === 'search') searchEnd(true); else stripHide(); } else setInput('', 0); }
      else if (k === 'ins') {
        const ch = b.getAttribute('data-ch') || '';
        const v = input.value;
        const c = typeof input.selectionStart === 'number' ? input.selectionStart : v.length;
        setInput(v.slice(0, c) + ch + v.slice(c), c + ch.length);
      }
      if (typeof input.focus === 'function') input.focus();
    });

    // ---- live: OS theme changes ------------------------------------------------
    window.addEventListener('message', (e) => {
      if (e.data?.type === 'set-theme' && e.data.theme) document.documentElement.dataset.theme = e.data.theme;
      if (e.data?.t === 'fs.changed') {
        // The OS says the SD moved under us; the completion cache is the only thing here that
        // remembers it, so drop exactly what changed rather than everything.
        cacheDrop(e.data.d && e.data.d.path);
        if (e.data.d?.path?.endsWith('settings.json')) loadTheme();
      }
    });
    async function loadTheme() {
      const s = await readJSON(SETTINGS);
      if (s?.ui?.theme) document.documentElement.dataset.theme = s.ui.theme;
    }

    // The vm harness and the CDP driver reach the engine through this instead of rewriting the
    // source, which used to break silently the moment a binding was renamed.
    globalThis.__T = { COMMANDS, run, exec, norm, api, fmtBytes, setCwd, hist, envVars, aliases,
      tokenize, parse, expandWord, submit, LIMITS, completions, applyCompletion, ctokens, lcp,
      cacheGet, cachePut, cacheDrop, animaDigest, encTrim, b64encode, b64decode, remember };

    // ---- boot ------------------------------------------------------------------
    async function init() {
      await loadTheme();
      emit(t('boot_hint'), 'dim');
      setCwd('/');
      setFont(1);
      input.focus();
      await loadPersisted();
      // The window can go away without a beforeunload on mobile; these two are the only events
      // that actually fire there, and keepalive is what lets the write survive the teardown.
      const flush = () => { if (histNew) saveHistory(true); };
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
      window.addEventListener('pagehide', flush);
    }
    init();
  </script>
</body>
</html>
