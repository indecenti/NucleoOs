<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal</title>
  <style>
    :root { --bg:#0e1830; --panel:#18233a; --text:#e8eefc; --muted:#8aa0c8; --accent:#4ea1ff;
      --line:#2a3a5e; --field:#0b1220; --ok:#2fd07a; --err:#e2576b; --warn:#f5b13d; }
    html[data-theme="light"] { --bg:#eef2fb; --panel:#ffffff; --text:#10203a; --muted:#5a6a86;
      --accent:#2b6fd6; --line:#cdd8ee; --field:#f4f7fe; --ok:#1c9d5b; --err:#c83e52; --warn:#c2820f; }
    * { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
    /* --fs is stepped by Ctrl+- / Ctrl+= and remembered: this console is read on a 2" panel as
       often as on a desktop, and one fixed size cannot serve both. */
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
      font: var(--fs, 15px)/1.35 ui-monospace, "Cascadia Code", Consolas, monospace; }
    header { display: flex; align-items: center; gap: 6px; padding: 4px 8px; flex: none;
      background: var(--panel); border-bottom: 1px solid var(--line); }
    header .t { flex: 1; font-weight: 600; font-size: 12px; letter-spacing: .3px; }
    header .cwd { color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; max-width: 45%; }
    header button { border: 1px solid var(--line); background: #80808018; color: var(--text);
      border-radius: 6px; padding: 2px 9px; cursor: pointer; font: inherit; font-size: 11px; }
    header button:hover { background: #80808033; }
    /* `anywhere` and not `break-word`: a long path must wrap instead of widening the page, but a
       short token must not be split down the middle. user-select is stated so nothing silently
       makes the transcript uncopyable again. */
    #out { flex: 1; overflow: auto; padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere;
      user-select: text; -webkit-user-select: text; }
    #out .line { display: block; }
    /* Columns are the one thing pre-wrap destroys: reflowing "df" on a 430px phone turns an aligned
       table into confetti. A line whose interior holds a run of spaces was aligned on purpose, so it
       scrolls sideways instead of wrapping — which is what a real terminal does with a wide row. */
    #out .pre { white-space: pre; }
    #out .cmd { color: var(--accent); cursor: pointer; }
    #out .dim { color: var(--muted); }
    #out .ok { color: var(--ok); } #out .err { color: var(--err); } #out .warn { color: var(--warn); }
    #out .dir { color: var(--accent); }
    #out .tap { cursor: pointer; }
    #out .sel { background: var(--accent); color: var(--bg); }
    /* Reading the scrollback while a command still prints must not be interrupted, so a tail that
       moved out of sight is announced instead of chased. */
    #pill { position: fixed; right: 12px; bottom: 46px; z-index: 5; border: 1px solid var(--accent);
      background: var(--panel); color: var(--accent); border-radius: 999px; padding: 4px 12px;
      font: inherit; font-size: 11px; cursor: pointer; }
    #pill[hidden] { display: none; }
    /* One row above the prompt for completion candidates and history matches. It is a row and not
       a list on purpose: a panel that grows is a panel that hides the transcript on a 135 px screen. */
    #strip { flex: none; display: flex; align-items: center; gap: 5px; padding: 3px 8px;
      background: var(--field); border-top: 1px solid var(--line); white-space: nowrap;
      overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; }
    #strip[hidden] { display: none; }
    #strip::-webkit-scrollbar { height: 4px; } #strip::-webkit-scrollbar-thumb { background: var(--line); }
    #strip .k { flex: none; color: var(--muted); font-size: 11px; user-select: none; }
    #strip .c { flex: none; position: relative; scroll-snap-align: start; border: 1px solid var(--line);
      border-radius: 5px; padding: 2px 8px; background: none; color: var(--text); font: inherit; cursor: pointer; }
    #strip .c .n { color: var(--muted); margin-right: 4px; }
    #strip .c.d { color: var(--accent); }
    #strip .c.on { background: var(--accent); color: var(--bg); border-color: transparent; }
    #strip .c.on .n { color: var(--bg); }
    #strip .c.more { color: var(--warn); }
    #strip .c.bad { color: var(--err); border-style: dashed; cursor: default; }
    @media (pointer: coarse) { #strip .c::after { content: ''; position: absolute; inset: -9px -3px; } }
    /* Dead weight next to a real keyboard, the only route to Tab / Ctrl+R / Ctrl+C on a touchscreen. */
    #keys { display: none; flex: none; gap: 5px; padding: 3px 6px; overflow-x: auto;
      background: var(--panel); border-top: 1px solid var(--line); }
    #keys button { flex: none; min-width: 44px; min-height: 32px; border: 1px solid var(--line);
      background: #80808018; color: var(--text); border-radius: 6px; font: inherit; cursor: pointer; }
    #keys button:active { background: var(--accent); color: var(--bg); }
    @media (pointer: coarse) { #keys { display: flex; } #pill { bottom: 96px; } }
    .prompt { display: flex; align-items: center; gap: 6px; padding: 5px 8px; flex: none; margin: 0;
      background: var(--field); border-top: 1px solid var(--line); }
    .prompt .ps { color: var(--ok); flex: none; }
    .prompt .ps.search { color: var(--warn); }
    .prompt .field { position: relative; flex: 1; min-width: 0; display: flex; }
    .prompt input { flex: 1; min-width: 0; border: 0; background: none; outline: none;
      color: var(--text); font: inherit; }
    /* The suggestion is drawn UNDER the input, never inside its value — so nothing that was not
       typed can ever be submitted. The typed half is transparent and only pushes the tail along. */
    #ghost { position: absolute; inset: 0; pointer-events: none; overflow: hidden; white-space: pre; }
    #ghost .a { color: transparent; } #ghost .b { color: var(--muted); }
    /* The run button is not decoration: it is the only send path on a keyboard that emits no
       Enter keydown (dictation, some IMEs), so it stays visible and finger-sized. */
    .prompt button { flex: none; min-width: 34px; min-height: 28px; border: 1px solid var(--line);
      background: #80808018; color: var(--accent); border-radius: 6px; font: inherit;
      line-height: 1; cursor: pointer; padding: 0 10px; }
    .prompt button:active { background: var(--accent); color: var(--bg); }
    @media (pointer: coarse) { .prompt button { min-width: 44px; min-height: 44px; } }
    /* thin scrollbar so the tiny screen keeps its width */
    #out::-webkit-scrollbar { width: 6px; } #out::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <span class="t">&gt;_ Terminal</span>
    <span class="cwd" id="cwd">/</span>
    <button id="clr" data-i18n="clear" data-i18n-attr="title:clr_tip">clear</button>
  </header>
  <div id="out"></div>
  <button id="pill" hidden data-i18n-attr="title:pill_tip">&#9660; <span id="pilln">0</span></button>
  <div id="strip" hidden></div>
  <div id="keys">
    <button data-k="tab" data-i18n-attr="title:key_tab">&#8677;</button>
    <button data-k="search" data-i18n-attr="title:key_search">&#8981;</button>
    <button data-k="up" data-i18n-attr="title:key_prev">&#8593;</button>
    <button data-k="down" data-i18n-attr="title:key_next">&#8595;</button>
    <button data-k="abort" data-i18n-attr="title:key_abort">^C</button>
    <button data-k="esc" data-i18n-attr="title:key_esc">esc</button>
    <button data-k="ins" data-ch="/">/</button>
    <button data-k="ins" data-ch="-">-</button>
    <button data-k="ins" data-ch="|">|</button>
  </div>
  <form class="prompt" id="cmdform" autocomplete="off">
    <span class="ps" id="ps">/ $</span>
    <span class="field">
      <input id="in" enterkeyhint="go" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-attr="placeholder:input_ph" placeholder="type 'help'…">
      <span id="ghost" aria-hidden="true"><span class="a" id="gha"></span><span class="b" id="ghb"></span></span>
    </span>
    <button type="submit" id="run" data-i18n-attr="title:run_tip;aria-label:run_tip" title="Run">&#9654;</button>
  </form>

  <script type="module">
    import I18N from '/nucleo-i18n.js';
    const t = await I18N.init('terminal');
    const out = document.getElementById('out');
    const input = document.getElementById('in');
    const cwdEl = document.getElementById('cwd');
    const psEl = document.getElementById('ps');
    const stripEl = document.getElementById('strip');
    const pillEl = document.getElementById('pill');
    const pillN = document.getElementById('pilln');
    const ghA = document.getElementById('gha');
    const ghB = document.getElementById('ghb');
    const SETTINGS = '/system/config/settings.json';
    // The manifest's own declared mount. It is the narrowest place this app may write, and the only
    // store that survives a browser change — which localStorage, on a shared kiosk browser, does not.
    const APPDIR = '/apps/terminal/data';

    // ---- device file API (degrades gracefully outside the OS) -----------------
    const api = (op, path, opts) => fetch(`/api/fs/${op}?path=` + encodeURIComponent(path), opts);
    // /proc is a firmware-served virtual filesystem (live system state as plain text), NOT real
    // SD files — so cat/ls/cd route to it directly instead of the /api/fs layer.
    const isProc = (p) => p === '/proc' || p.startsWith('/proc/');
    async function readJSON(path) {
      try { const r = await fetch('/api/fs/read?path=' + encodeURIComponent(path), { cache: 'no-store' });
        return r.ok ? JSON.parse(await r.text()) : null; } catch { return null; }
    }

    // ---- working directory (normalised, absolute) -----------------------------
    let cwd = '/';
    const envVars = { SHELL: '/bin/sh', PATH: '/apps/bin', USER: 'admin', OS: 'NucleoOS', TERM: 'xterm-color', CWD: '/' };
    const norm = (p) => {
      const abs = p.startsWith('/') ? p : cwd + '/' + p;
      const parts = []; for (const seg of abs.split('/')) {
        if (!seg || seg === '.') continue;
        if (seg === '..') parts.pop(); else parts.push(seg);
      }
      return '/' + parts.join('/');
    };
    const setCwd = (p) => { cwd = p || '/'; cwdEl.textContent = cwd; psEl.textContent = cwd + ' $'; envVars.CWD = cwd; };
    // User-defined command names, expanded once (never recursively) when a stage is resolved.
    const aliases = {};
    let watching = false, lastScanAt = 0;

    // ---- bounds -----------------------------------------------------------------
    // ~18 KB of device heap, 4-6 shared sockets, and a browser that is often a phone: every
    // number here exists so one mistyped command cannot monopolise either side of the wire.
    const LIMITS = {
      maxLines: 400,          // logical lines kept in the scrollback
      maxBytes: 64 * 1024,    // per-line render cap, and per-stage pipe buffer cap
      maxRows: 200,           // directory entries ls prints
      maxMatches: 200,        // matches grep prints
      maxListCalls: 60,       // /api/fs/list calls one find may spend
      maxDepth: 6,            // levels find may descend
      maxStages: 8,           // commands in one pipeline
      maxQueued: 8,           // submitted lines allowed to wait behind the running one
      submitDebounceMs: 30,   // window in which a second Enter signal is still the same gesture
    };

    // ---- output helpers --------------------------------------------------------
    // A non-final pipeline stage swaps `sink` for a buffer. Errors deliberately bypass it: a
    // failure that is about to abort the pipeline must never end up in a discarded buffer.
    let sink = null, errors = 0, lineCount = 0, trimNote = null, unseen = 0;
    function emit(text, cls, tap) {
      const s = text == null ? '' : String(text);
      if (cls === 'err') errors++;
      if (sink && cls !== 'err') { sink(s); return; }
      if (s.length > LIMITS.maxBytes) {
        addLine(s.slice(0, LIMITS.maxBytes), cls);
        addLine(`… truncated: ${fmtBytes(s.length)} in total, first ${fmtBytes(LIMITS.maxBytes)} shown`, 'warn');
        return;
      }
      addLine(s, cls, tap);
    }
    // `tap` is what makes a line actionable on a touchscreen: retyping a path picked out of wrapped
    // monospace with a thumb is the single most expensive thing this app can ask of a phone.
    function addLine(text, cls, tap) {
      const follow = atBottom();
      const el = document.createElement('span');
      // `.cmd` already carries the pointer cursor, so it does not take the extra class — which
      // also keeps a prompt echo identifiable by its class alone.
      el.className = 'line' + (cls ? ' ' + cls : '') + (tap && cls !== 'cmd' ? ' tap' : '')
        + (/\S {2,}\S/.test(text) ? ' pre' : '');   // aligned columns: scroll, never reflow
      el.textContent = text;
      el.__lines = text.split('\n').length;
      if (tap) el.__tap = tap;
      out.appendChild(el);
      lineCount += el.__lines;
      if (lineCount > LIMITS.maxLines) trimTop();
      if (follow) out.scrollTop = out.scrollHeight;
      else showPill(el.__lines);
    }
    // Scrolling up to read while a command is still printing must not yank the view back down,
    // so the tail is followed only when it was already in sight.
    function atBottom() {
      const top = out.scrollTop, view = out.clientHeight, all = out.scrollHeight;
      if (typeof top !== 'number' || typeof view !== 'number' || typeof all !== 'number') return true;
      return all - top - view < 40;
    }
    function trimTop() {
      if (typeof out.removeChild !== 'function') { lineCount = LIMITS.maxLines; return; }
      while (lineCount > LIMITS.maxLines) {
        const first = out.firstChild === trimNote ? trimNote.nextSibling : out.firstChild;
        if (!first) break;
        lineCount -= first.__lines || 1;
        out.removeChild(first);
      }
      if (!trimNote) {
        trimNote = document.createElement('span');
        trimNote.className = 'line dim';
        trimNote.textContent = '⋯ earlier output trimmed';
      }
      if (out.firstChild !== trimNote && typeof out.insertBefore === 'function') out.insertBefore(trimNote, out.firstChild);
    }
    // `watch` redraws in place instead of appending a screenful per tick. The guards exist because
    // the test DOM has no child list at all: without one, watch degrades to appending, not to a crash.
    function childCount() {
      if (out.children && typeof out.children.length === 'number') return out.children.length;
      if (out.childNodes && typeof out.childNodes.length === 'number') return out.childNodes.length;
      return -1;
    }
    function dropSince(mark) {
      if (mark < 0 || typeof out.removeChild !== 'function') return;
      while (childCount() > mark) {
        const last = out.lastChild || (out.children && out.children[out.children.length - 1]);
        if (!last) return;
        lineCount -= last.__lines || 1;
        out.removeChild(last);
      }
    }
    function showPill(n) {
      unseen += n;
      if (!pillEl || typeof pillEl !== 'object') return;
      if (pillN) pillN.textContent = String(unseen);
      pillEl.hidden = false;
    }
    function toBottom() {
      unseen = 0;
      if (pillEl) pillEl.hidden = true;
      if (typeof out.scrollHeight === 'number') out.scrollTop = out.scrollHeight;
    }
    const fmtBytes = (b) => b >= 1e9 ? (b/1e9).toFixed(2)+' GB' : b >= 1e6 ? (b/1e6).toFixed(1)+' MB'
      : b >= 1e3 ? (b/1e3).toFixed(1)+' KB' : b + ' B';

    // ---- device helpers shared by the system commands ---------------------------
    // One shape for every device GET that answers JSON, so no command has to invent a plausible
    // zero when the device simply did not answer. 401 is named as 401: unpaired is not "offline".
    // One sentence for every filesystem failure, and it always names the reason. "mkdir: failed"
    // is the difference between a bug report and a shrug — and 401 has to say 401, because
    // "cannot read" reads like a broken card when the truth is an unpaired browser.
    function fsFail(name, path, r) {
      if (!r) emit(`${name}: cannot reach the file API (running outside the OS?)`, 'err');
      else if (r.status === 401) emit(`${name}: not paired (401)`, 'err');
      else if (r.status === 404) emit(`${name}: no such file or directory: ${path}`, 'err');
      else emit(`${name}: failed on ${path} (status ${r.status})`, 'err');
    }
    async function devJSON(name, url) {
      let r;
      try { r = await fetch(url, { cache: 'no-store' }); }
      catch { emit(`${name}: cannot reach the device`, 'err'); return null; }
      if (r.status === 401) { emit(`${name}: not paired (401)`, 'err'); return null; }
      if (r.status === 404) { emit(`${name}: not available on this build (404)`, 'warn'); return null; }
      if (!r.ok) { emit(`${name}: failed (status ${r.status})`, 'err'); return null; }
      try { return await r.json(); } catch { emit(`${name}: invalid response`, 'err'); return null; }
    }
    async function devPOST(name, url, body) {
      let r;
      try {
        r = await fetch(url, body === undefined ? { method: 'POST' }
          : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      } catch { emit(`${name}: cannot reach the device`, 'err'); return null; }
      if (r.status === 401) { emit(`${name}: not paired (401)`, 'err'); return null; }
      if (r.status === 404) { emit(`${name}: not available on this build (404)`, 'warn'); return null; }
      if (!r.ok) { emit(`${name}: failed (status ${r.status})`, 'err'); return null; }
      try { return await r.json(); } catch { return {}; }
    }
    // Flatten a nested diagnostic object into `key value` lines: two levels is all the device emits,
    // and flat text is the only shape that pipes into grep, sort or anima without a parser.
    function flatten(obj, prefix, outArr) {
      for (const [k, v] of Object.entries(obj || {})) {
        const key = prefix ? prefix + '.' + k : k;
        if (v && typeof v === 'object' && !Array.isArray(v)) flatten(v, key, outArr);
        else outArr.push(key + ' ' + (Array.isArray(v) ? v.join(',') : v === true ? 1 : v === false ? 0 : v));
      }
      return outArr;
    }
    // /api/apps is asked for by `which`, `apps` and `open`; one memo keeps three commands honest
    // without three requests, and 30 s is far shorter than the time it takes to install an app.
    let appsMemo = null, appsAt = 0;
    async function appList(name) {
      if (appsMemo && Date.now() - appsAt < 30000) return appsMemo;
      const j = await devJSON(name, '/api/apps');
      if (!j) return null;
      appsMemo = j.apps || []; appsAt = Date.now();
      return appsMemo;
    }
    // du and tree share one budgeted walk, for the same reason find has one: a recursive listing is
    // the only thing this shell can do that starves the device's four sockets.
    // onEntry fires in ls order and a directory is descended immediately after it is announced, so
    // `tree` can print depth-first without buffering the whole walk.
    async function bwalk(root, maxDepth, onDir, onEntry) {
      const st = { calls: 0, capped: false };
      const step = async (dir, depth) => {
        if (aborted || st.capped) return;
        if (depth > maxDepth || st.calls >= LIMITS.maxListCalls) { st.capped = true; return; }
        st.calls++;
        let r;
        try { r = await api('list', dir); } catch { return; }
        if (!r.ok) return;
        let j;
        try { j = await r.json(); } catch { return; }
        const entries = (j.entries || []).slice().sort((a, b) =>
          a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1);
        if (onDir) onDir(dir, depth, entries);
        for (const e of entries) {
          if (aborted || st.capped) break;
          const full = dir === '/' ? '/' + e.name : dir + '/' + e.name;
          if (onEntry) onEntry(full, depth, e);
          if (e.type === 'dir') await step(full, depth + 1);
        }
      };
      await step(root, 1);
      return st;
    }
    // UTF-8 by hand for the same reason base64 is: the sandbox has no TextEncoder, and a device
    // browser that predates it would corrupt every accented character in silence.
    function utf8Bytes(s) {
      const o = [];
      for (const ch of String(s)) {
        const c = ch.codePointAt(0);
        if (c < 0x80) o.push(c);
        else if (c < 0x800) o.push(0xc0 | (c >> 6), 0x80 | (c & 63));
        else if (c < 0x10000) o.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
        else o.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
      }
      return o;
    }
    function utf8Text(b) {
      let s = '';
      for (let i = 0; i < b.length;) {
        const c = b[i++];
        if (c < 0x80) s += String.fromCharCode(c);
        else if (c < 0xe0) s += String.fromCodePoint(((c & 31) << 6) | (b[i++] & 63));
        else if (c < 0xf0) s += String.fromCodePoint(((c & 15) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
        else s += String.fromCodePoint(((c & 7) << 18) | ((b[i++] & 63) << 12) | ((b[i++] & 63) << 6) | (b[i++] & 63));
      }
      return s;
    }
    // Hand-rolled because btoa is latin1-only — it corrupts every byte above 0x7F, which is most of
    // a firmware image — and because the test sandbox has neither btoa nor TextEncoder.
    const B64AB = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    function b64encode(bytes) {
      let s = '';
      for (let i = 0; i < bytes.length; i += 3) {
        const a = bytes[i], b = bytes[i + 1], c = bytes[i + 2];
        s += B64AB[a >> 2] + B64AB[((a & 3) << 4) | ((b || 0) >> 4)];
        s += i + 1 < bytes.length ? B64AB[((b & 15) << 2) | ((c || 0) >> 6)] : '=';
        s += i + 2 < bytes.length ? B64AB[c & 63] : '=';
      }
      return s;
    }
    function b64decode(str) {
      const clean = String(str).replace(/[^A-Za-z0-9+/]/g, '');
      const bytes = [];
      for (let i = 0; i < clean.length; i += 4) {
        const n = (B64AB.indexOf(clean[i]) << 18) | (B64AB.indexOf(clean[i + 1]) << 12)
          | ((B64AB.indexOf(clean[i + 2]) & 63) << 6) | (B64AB.indexOf(clean[i + 3]) & 63);
        bytes.push((n >> 16) & 255);
        if (i + 2 < clean.length) bytes.push((n >> 8) & 255);
        if (i + 3 < clean.length) bytes.push(n & 255);
      }
      return bytes;
    }
    // ANIMA's query buffer is char q[160] behind a char query[208] URL-decode buffer, so the whole
    // encoded query string has to fit. Trim by CODE POINT, never by character: cutting mid-%XX or
    // mid-UTF-8 hands the firmware a byte sequence it cannot decode.
    const ANIMA_Q_ENC = 150;
    function encTrim(s, cap) {
      let n = 0, kept = '';
      for (const cp of String(s)) {
        const w = encodeURIComponent(cp).length;
        if (n + w > cap) break;
        n += w; kept += cp;
      }
      return kept;
    }
    // A 2 KB log ring cannot cross a 150-byte query, so the browser digests first: drop timestamps
    // and the repeated prefix, keep the distinct lines in severity order, and count the duplicates.
    function animaDigest(text) {
      const seen = new Map();
      for (let ln of String(text).split(/\r?\n/)) {
        ln = ln.replace(/^\s*[\[(]?\d{1,10}[:.\]) ]*\s*/, '').replace(/\s+/g, ' ').trim();
        if (!ln) continue;
        seen.set(ln, (seen.get(ln) || 0) + 1);
      }
      const rank = (s) => (/^E|error|fail|panic/i.test(s) ? 0 : /^W|warn/i.test(s) ? 1 : 2);
      return [...seen.entries()]
        .sort((a, b) => rank(a[0]) - rank(b[0]) || b[1] - a[1])
        .map(([s, n]) => (n > 1 ? `${s} x${n}` : s))
        .join('; ');
    }

    // ---- commands --------------------------------------------------------------
    const COMMANDS = {
      help(arg) {
        // `help` is a table, not prose: `man <command>` holds the prose, in it and en, on the SD.
        const groups = {
          files: [
            ['ls [path]', 'list a directory'],
            ['cd <path>', 'change directory   (cd ..  cd /data)'],
            ['pwd', 'print working directory'],
            ['cat <file>', 'print a file  (try: cat /proc/meminfo)'],
            ['stat <path>', 'type, size and lock state of one entry'],
            ['cp <src> <dst>', 'copy a file'],
            ['mv <src> <dst>', 'move or rename a file'],
            ['mkdir <dir>', 'create a directory'],
            ['touch <file>', 'create an empty file'],
            ['rm <path>', 'delete a file or directory'],
            ['open <file>', 'open in the default app'],
            ['du [-d N] [path]', 'disk usage per directory, biggest first'],
            ['tree [-L N] [path]', 'directory tree'],
            ['find [path] -name <p>', 'find files recursively (bounded)'],
            ['df', 'display disk space usage'],
            ['hexdump [-n N] <file>', 'hex + ASCII of the first bytes (Range read)'],
            ['base64 [-d] [file]', 'encode or decode base64'],
          ],
          text: [
            ['echo <text>', 'print text'],
            ['grep <pat> [file]', 'search a pattern'],
            ['wc [file]', 'count lines, words and bytes'],
            ['head [-n N] [file]', 'first lines'],
            ['tail [-n N] [file]', 'last lines'],
            ['sort [-r|-n|-u|-k N]', 'sort stdin'],
            ['uniq [-c]', 'collapse repeated lines'],
            ['cut -d<c> -f<list>', 'select fields or -c<a-b> columns'],
            ['tr <set1> <set2> | -d <set>', 'translate or delete characters'],
            ['seq [first] last', 'print a range of integers'],
            ['tee <file>', 'pass stdin through and write it'],
          ],
          system: [
            ['status', 'system + storage + network'],
            ['diag [prefix]', 'the whole diagnostic table, one key per line'],
            ['heap', 'heap detail — fragmentation, not just free bytes'],
            ['cpu', 'cores, frequency, tasks, load'],
            ['free', 'free heap memory'],
            ['uptime', 'show device uptime'],
            ['uname [-a]', 'print system information'],
            ['dmesg [-l E|W|I|D|V]', 'device logs, filtered on the device'],
            ['ota', 'running slot, next slot, rollback state'],
            ['date [-u] [-s]', 'local and device time; -s pushes the browser clock'],
            ['lang [it|en|fr|es|de]', 'read or set the OS language'],
            ['apps [-a] | apps open <id>', 'installed apps'],
            ['ps', 'running apps as a process table'],
            ['kill <app-id>', 'close a foreground app (see `ps`)'],
            ['assoc [ext]', 'which app `open` will pick'],
            ['which <name>', 'builtin, app, or not found'],
            ['reboot', 'reboot the Cardputer'],
            ['watch [-n S] [-c N] <cmd>', 're-run a command in place'],
          ],
          anima: [
            ['anima [-o off|on|only] [-v] <q>', 'ask the offline brain; reads stdin as context'],
            ['anima --caps', 'which brain is actually answering'],
            ['anima --l1 on|off|auto', 'pin or free the ~31 KB offline index'],
            ['verify <key> <asserted>', 'grounded fact check'],
          ],
          radios: [
            ['wifi scan|known|join|forget|prio|reconnect', 'Wi-Fi (needs net.wifi)'],
            ['ir db|send|raw|tvbgone', 'infrared (needs device.ir)'],
            ['link peers|status', 'ESP-NOW neighbours (needs mesh.peer)'],
            ['display on|off', 'panel power (needs device.display)'],
            ['gpio read <pin> | write <pin> <0|1>', 'raw pin I/O on the safe allowlist'],
            ['screen [-o <file>]', 'save what the panel shows (needs device.display)'],
            ['say [text]', 'speak text (needs device.audio)'],
            ['notify <text>', 'post an OS notification (needs system.notify)'],
            ['clip [-o]', 'write stdin to, or read, the OS clipboard'],
          ],
          shell: [
            ['ping [host]', 'ping Cardputer or external host'],
            ['curl <url>', 'fetch and display URL content'],
            ['wget <url> [-O f]', 'download URL content to a file'],
            ['sleep <sec>', 'delay execution for N seconds'],
            ['env', 'show environment variables'],
            ['export [V=val]', 'set an environment variable'],
            ['alias [n=cmd] | unalias n', 'name a long command'],
            ['history [clear|N]', 'command history'],
            ['man <command>', 'show the manual page for a command'],
            ['theme [dark|light]', 'read or switch theme'],
            ['clear', 'clear the screen   (Ctrl+L)'],
          ],
        };
        const want = (arg || '').trim().toLowerCase();
        const names = Object.keys(groups);
        if (want && !names.includes(want)) { emit('help: no such section — ' + names.join(' '), 'err'); return; }
        for (const g of names) {
          if (want && g !== want) continue;
          emit(g + ':', 'dim');
          for (const [syn, desc] of groups[g]) emit('  ' + syn.padEnd(30) + desc, 'dim');
        }
        if (want) return;
        emit('Shell: a | b   pipe · > file  >> file  < file   redirect · a ; b   a && b   a || b', 'dim');
        emit('Quoting: "double" expands $VARS, \'single\' is literal, \\ escapes one character.', 'dim');
        emit('Keys: Tab completes · Ctrl+R searches history · ↑ ↓ recall · Ctrl+C stops · Ctrl+L clears.', 'dim');
        emit('help <section> narrows this list: ' + names.join(' '), 'dim');
      },
      async ls(arg) {
        const path = arg ? norm(arg) : cwd;
        if (path === '/proc') {                                  // virtual FS: list its nodes
          try { const rp = await fetch('/proc', { cache: 'no-store' }); if (!rp.ok) throw 0;
            const nodes = (await rp.text()).split(/\n/).filter(Boolean);
            for (const nm of nodes) emit('  ' + nm, '');
            emit(`${nodes.length} item${nodes.length === 1 ? '' : 's'}`, 'dim'); }
          catch { emit('ls: cannot reach /proc', 'err'); }
          return;
        }
        if (path.startsWith('/proc/')) { emit('ls: not a directory: ' + path + ' (try: cat ' + path + ')', 'err'); return; }
        let r;
        try { r = await api('list', path); }
        catch { emit('ls: cannot reach the file API (running outside the OS?)', 'err'); return; }
        if (!r.ok) {
          if (r.status === 404) emit('ls: no such directory: ' + path, 'err');
          else emit('ls: failed to list directory (status ' + r.status + ')', 'err');
          return;
        }
        let j;
        try { j = await r.json(); }
        catch { emit('ls: invalid response from server', 'err'); return; }
        const entries = (j.entries || []).sort((a, b) =>
          a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1);
        if (!entries.length) { emit('(empty)', 'dim'); return; }
        for (const e of entries.slice(0, LIMITS.maxRows)) {
          const tap = { kind: e.type === 'dir' ? 'dir' : 'file', name: e.name };
          if (e.type === 'dir') emit('  ' + e.name + '/', 'dir', tap);
          else emit('  ' + e.name.padEnd(28) + fmtBytes(e.size || 0).padStart(10), '', tap);
        }
        if (entries.length > LIMITS.maxRows) emit(`showing first ${LIMITS.maxRows} of ${entries.length}`, 'warn');
        emit(`${entries.length} item${entries.length === 1 ? '' : 's'}`, 'dim');
      },
      async cd(arg) {
        if (!arg) { setCwd('/'); return; }
        const path = norm(arg);
        if (path === '/proc') { setCwd('/proc'); return; }       // virtual FS root is always "there"
        try { const r = await api('list', path); if (!r.ok) throw 0; await r.json(); setCwd(path); }
        catch { emit('cd: no such directory: ' + path, 'err'); }
      },
      pwd() { emit(cwd); },
      async cat(arg, ctx) {
        if (!arg) {
          if (ctx?.stdin != null) { emit(ctx.stdin); return; }   // `a | cat` is the identity stage
          emit('cat: missing file', 'err'); return;
        }
        const path = norm(arg);
        if (isProc(path)) {                                      // live system node, served as plain text
          let r;
          try { r = await fetch(path, { cache: 'no-store' }); }
          catch { emit('cat: cannot read ' + path, 'err'); return; }
          if (!r.ok) { emit(`cat: cannot read ${path} (status ${r.status})`, 'err'); return; }
          emit((await r.text()).replace(/\n$/, ''));
          return;
        }
        let r;
        try { r = await api('read', path); } catch { fsFail('cat', path, null); return; }
        if (!r.ok) { fsFail('cat', path, r); return; }
        const txt = await r.text();
        emit(txt.length ? txt.replace(/\n$/, '') : '(empty file)', txt.length ? '' : 'dim');
      },
      async cp(arg) {
        const m = arg && arg.match(/^(".*?"|\S+)\s+(".*?"|\S+)$/);
        if (!m) { emit('usage: cp <source> <dest>', 'err'); return; }
        const src = norm(m[1].replace(/^"|"$/g, ''));
        const dest = norm(m[2].replace(/^"|"$/g, ''));
        try {
          emit(`copying ${src} to ${dest} ...`, 'dim');
          const rRead = await api('read', src);
          if (!rRead.ok) { fsFail('cp', src, rRead); return; }
          const buf = await rRead.arrayBuffer();
          const rWrite = await api('write', dest, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: buf
          });
          if (rWrite.ok) emit('copied successfully', 'ok');
          else fsFail('cp', dest, rWrite);
        } catch { emit('cp: file API unavailable', 'err'); }
      },
      async mv(arg) {
        const m = arg && arg.match(/^(".*?"|\S+)\s+(".*?"|\S+)$/);
        if (!m) { emit('usage: mv <source> <dest>', 'err'); return; }
        const src = norm(m[1].replace(/^"|"$/g, ''));
        const dest = norm(m[2].replace(/^"|"$/g, ''));
        try {
          emit(`moving ${src} to ${dest} ...`, 'dim');
          const rRead = await api('read', src);
          if (!rRead.ok) { fsFail('mv', src, rRead); return; }
          const buf = await rRead.arrayBuffer();
          const rWrite = await api('write', dest, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: buf
          });
          if (!rWrite.ok) { fsFail('mv', dest, rWrite); return; }
          const rDel = await api('delete', src, { method: 'POST' });
          if (rDel.ok) emit('moved successfully', 'ok');
          else emit('mv: copied to destination but failed to delete source', 'warn');
        } catch { emit('mv: file API unavailable', 'err'); }
      },
      async mkdir(arg) {
        if (!arg) { emit('mkdir: missing name', 'err'); return; }
        try { const r = await api('mkdir', norm(arg), { method: 'POST' });
          if (r.ok) emit('created ' + norm(arg), 'ok'); else fsFail('mkdir', norm(arg), r); }
        catch { fsFail('mkdir', norm(arg), null); }
      },
      async touch(arg) {
        if (!arg) { emit('touch: missing name', 'err'); return; }
        try { const r = await api('write', norm(arg), { method: 'POST', body: '' });
          if (r.ok) emit('created ' + norm(arg), 'ok'); else fsFail('touch', norm(arg), r); }
        catch { fsFail('touch', norm(arg), null); }
      },
      async rm(arg) {
        if (!arg) { emit('rm: missing path', 'err'); return; }
        try { const r = await api('delete', norm(arg), { method: 'POST' });
          if (r.ok) emit('removed ' + norm(arg), 'ok'); else fsFail('rm', norm(arg), r); }
        catch { fsFail('rm', norm(arg), null); }
      },
      async echo(arg, ctx) {
        // Through the shell the parser already took the redirection, so every remaining word is
        // literal text; the "text > file" branch below only serves a direct, tokenless call.
        if (ctx?.argv) { emit(ctx.argv.slice(1).join(' ')); return; }
        const m = arg && arg.match(/^(.*?)\s*>\s*(.+?)\s*$/);
        if (!m) { emit(arg || ''); return; }                       // plain echo
        const body = m[1].replace(/^"|"$/g, ''), path = norm(m[2].replace(/^"|"$/g, ''));
        try { const r = await api('write', path, { method: 'POST', body });
          if (r.ok) emit('wrote ' + path, 'ok'); else fsFail('echo', path, r); }
        catch { fsFail('echo', path, null); }
      },
      open(arg) {
        if (!arg) { emit('open: missing file', 'err'); return; }
        const p = norm(arg);
        try { parent.postMessage({ type: 'open-file', path: p }, '*'); emit('opening ' + p + ' …', 'dim'); }
        catch { emit('open: shell not reachable', 'err'); }
      },
      async grep(arg, ctx) {
        // From a pipe grep filters stdin and prints bare lines, so the result stays pipeable;
        // reading a named file keeps the numbered form, which is what makes it readable on screen.
        if (ctx?.stdin != null && ctx.argv && ctx.argv.length === 2) {
          const pattern = ctx.argv[1];
          let found = 0;
          for (const ln of ctx.stdin.split(/\r?\n/)) {
            if (!ln.includes(pattern)) continue;
            if (found >= LIMITS.maxMatches) { emit(`grep: stopped at ${found} matches`, 'warn'); break; }
            emit(ln); found++;
          }
          if (found === 0) emit('(no matches)', 'dim');
          return;
        }
        const m = arg && arg.match(/^(".*?"|\S+)\s+(.+)$/);
        if (!m) { emit('usage: grep <pattern> <file>', 'err'); return; }
        const pattern = m[1].replace(/^"|"$/g, '');
        const file = norm(m[2].replace(/^"|"$/g, ''));
        try {
          const r = await api('read', file);
          if (!r.ok) { fsFail('grep', file, r); return; }
          const txt = await r.text();
          const lines = txt.split(/\r?\n/);
          let found = 0;
          for (let i = 0; i < lines.length; i++) {
            if (lines[i].includes(pattern)) {
              if (found >= LIMITS.maxMatches) { emit(`grep: stopped at ${found} matches`, 'warn'); break; }
              emit(`${i + 1}: ${lines[i]}`);
              found++;
            }
          }
          if (found === 0) emit('(no matches)', 'dim');
        } catch { emit('grep: file API unavailable', 'err'); }
      },
      async find(arg) {
        let path = cwd;
        let pattern = '';
        const m = arg && arg.match(/^(.*?)\s*-name\s+(.+)$/);
        if (m) {
          path = m[1] ? norm(m[1].trim()) : cwd;
          pattern = m[2].replace(/^"|"$/g, '').trim();
        } else {
          pattern = (arg || '').replace(/^"|"$/g, '').trim();
        }
        if (!pattern) { emit('usage: find [path] -name <pattern>', 'err'); return; }
        emit(`searching for "${pattern}" under ${path} ...`, 'dim');
        let count = 0, calls = 0, capped = false;
        // One listing costs the device a stat() per entry plus a subdirectory scan, so the walk
        // is budgeted: an unbounded find over the whole SD is the one command that can starve
        // the 4-6 sockets the rest of the shell needs.
        const scan = async (dirPath, depth) => {
          if (aborted || capped) return;
          if (depth > LIMITS.maxDepth || calls >= LIMITS.maxListCalls) { capped = true; return; }
          calls++;
          let r;
          try { r = await api('list', dirPath); } catch { return; }
          if (!r.ok) return;
          let j; try { j = await r.json(); } catch { return; }
          const entries = j.entries || [];
          for (const e of entries) {
            if (aborted || capped) return;
            const full = dirPath === '/' ? '/' + e.name : dirPath + '/' + e.name;
            if (e.name.toLowerCase().includes(pattern.toLowerCase())) {
              emit(full, e.type === 'dir' ? 'dir' : '');
              count++;
            }
            if (e.type === 'dir' && e.name !== '.' && e.name !== '..') {
              await scan(full, depth + 1);
            }
          }
        };
        await scan(path, 1);
        if (capped) emit(`find: search stopped after ${calls} directories (depth ${LIMITS.maxDepth}) — narrow the path`, 'warn');
        emit(`found ${count} item(s)`, 'dim');
      },
      async wc(arg, ctx) {
        const count = (txt, tail) => {
          const lines = txt.split(/\r?\n/).length;
          const words = txt.trim().split(/\s+/).filter(Boolean).length;
          emit(`  ${lines} lines, ${words} words, ${new Blob([txt]).size} bytes${tail}`);
        };
        if (!arg) {
          if (ctx?.stdin != null) { count(ctx.stdin, ''); return; }
          emit('usage: wc <file>', 'err'); return;
        }
        const file = norm(arg.replace(/^"|"$/g, ''));
        try {
          const r = await api('read', file);
          if (!r.ok) { fsFail('wc', file, r); return; }
          count(await r.text(), ' for ' + file);
        } catch { emit('wc: file API unavailable', 'err'); }
      },
      async head(arg, ctx) {
        let file = '';
        let n = 10;
        const m = arg && arg.match(/^-n\s+(\d+)\s*(.*)$/);
        if (m) {
          n = parseInt(m[1]);
          if (m[2]) file = norm(m[2].replace(/^"|"$/g, ''));
        } else if (arg) {
          file = norm(arg.replace(/^"|"$/g, ''));
        }
        if (!file && ctx?.stdin != null) { emit(ctx.stdin.split(/\r?\n/).slice(0, n).join('\n')); return; }
        if (!file) { emit('usage: head [-n <lines>] <file>', 'err'); return; }
        try {
          const r = await api('read', file);
          if (!r.ok) { fsFail('head', file, r); return; }
          const txt = await r.text();
          const lines = txt.split(/\r?\n/).slice(0, n);
          emit(lines.join('\n'));
        } catch { emit('head: file API unavailable', 'err'); }
      },
      async tail(arg, ctx) {
        let file = '';
        let n = 10;
        const m = arg && arg.match(/^-n\s+(\d+)\s*(.*)$/);
        if (m) {
          n = parseInt(m[1]);
          if (m[2]) file = norm(m[2].replace(/^"|"$/g, ''));
        } else if (arg) {
          file = norm(arg.replace(/^"|"$/g, ''));
        }
        if (!file && ctx?.stdin != null) {
          const all = ctx.stdin.split(/\r?\n/);
          emit(all.slice(Math.max(0, all.length - n)).join('\n')); return;
        }
        if (!file) { emit('usage: tail [-n <lines>] <file>', 'err'); return; }
        try {
          const r = await api('read', file);
          if (!r.ok) { fsFail('tail', file, r); return; }
          const txt = await r.text();
          const allLines = txt.split(/\r?\n/);
          const lines = allLines.slice(Math.max(0, allLines.length - n));
          emit(lines.join('\n'));
        } catch { emit('tail: file API unavailable', 'err'); }
      },
      async df() {
        let s;
        try {
          const r = await fetch('/api/status', { cache: 'no-store' });
          s = r.ok ? await r.json() : null;
        } catch {}
        if (!s || !s.storage || !s.storage.mounted) { emit('df: storage not mounted or unreachable', 'err'); return; }
        const total = s.storage.total_bytes || 0;
        const free = s.storage.free_bytes || 0;
        const used = total - free;
        const pct = total ? Math.round((used / total) * 100) : 0;
        emit('Filesystem      Size      Used     Avail  Use%  Mounted on');
        emit(`SDCard          ${fmtBytes(total).padEnd(9)} ${fmtBytes(used).padEnd(9)} ${fmtBytes(free).padEnd(8)}  ${pct}%   /data`);
      },
      async uptime() {
        let s;
        try {
          const r = await fetch('/api/status', { cache: 'no-store' });
          s = r.ok ? await r.json() : null;
        } catch {}
        if (!s) { emit('uptime: device unreachable', 'err'); return; }
        const secs = s.uptime_s || 0;
        const hrs = Math.floor(secs / 3600);
        const mins = Math.floor((secs % 3600) / 60);
        const remainingSecs = secs % 60;
        emit(`up ${hrs}h ${mins}m ${remainingSecs}s, heap free: ${fmtBytes(s.free_heap || 0)}`);
      },
      async ping(arg) {
        let target = '/api/status';
        let isDevice = true;
        if (arg) {
          target = arg.trim();
          if (!/^https?:\/\//i.test(target)) target = 'https://' + target;
          isDevice = false;
        }
        emit(`PING ${isDevice ? 'Cardputer' : target} ...`, 'dim');
        const count = 4;
        let sent = 0, received = 0;
        const times = [];
        for (let i = 0; i < count; i++) {
          if (aborted) break;
          const start = performance.now();
          try {
            const url = isDevice ? `${target}?_cb=${start}` : target;
            await fetch(url, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' });
            const end = performance.now();
            const rtt = Math.round(end - start);
            times.push(rtt);
            emit(`  Reply from ${isDevice ? 'Cardputer' : target}: time=${rtt}ms`);
            received++;
          } catch (err) {
            emit(`  Request timeout or CORS blocked for ${target}`, 'warn');
          }
          sent++;
          await new Promise(r => setTimeout(r, 500));
        }
        if (received > 0) {
          const min = Math.min(...times);
          const max = Math.max(...times);
          const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
          emit(`Packets: Sent = ${sent}, Received = ${received}, Lost = ${sent - received} (${Math.round((sent-received)/sent*100)}% loss)`, 'dim');
          emit(`Approximate round trip times: Min = ${min}ms, Max = ${max}ms, Average = ${avg}ms`, 'ok');
        } else {
          emit(`Packets: Sent = ${sent}, Received = 0, Lost = ${sent} (100% loss)`, 'err');
        }
      },
      async curl(arg) {
        if (!arg) { emit('usage: curl <url>', 'dim'); return; }
        let url = arg.trim();
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        emit(`fetching ${url} ...`, 'dim');
        try {
          const r = await fetch(url);
          if (!r.ok) { emit(`curl: failed (status ${r.status})`, 'err'); return; }
          const text = await r.text();
          emit(text);
        } catch (err) {
          emit('curl: failed (network error or CORS blocked)', 'err');
        }
      },
      async wget(arg) {
        if (!arg) { emit('usage: wget <url> [-O outfile]', 'dim'); return; }
        let url = '';
        let outPath = '';
        const m = arg.match(/^(.*?)\s*-O\s+(\S+)\s*$/);
        if (m) {
          url = m[1].trim();
          outPath = norm(m[2].replace(/^"|"$/g, ''));
        } else {
          url = arg.trim();
          const parts = url.split('/');
          let filename = parts[parts.length - 1] || 'downloaded_file';
          filename = filename.split('?')[0];
          outPath = norm(filename);
        }
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        emit(`downloading ${url} ...`, 'dim');
        try {
          const r = await fetch(url);
          if (!r.ok) { emit(`wget: failed (status ${r.status})`, 'err'); return; }
          const buf = await r.arrayBuffer();
          emit(`writing to ${outPath} ...`, 'dim');
          const rWrite = await api('write', outPath, {
            method: 'POST',
            headers: { 'Content-Type': 'application/octet-stream' },
            body: buf
          });
          if (rWrite.ok) emit(`saved successfully to ${outPath}`, 'ok');
          else emit(`wget: failed to write destination ${outPath}`, 'err');
        } catch (err) {
          emit('wget: failed (network error or CORS blocked)', 'err');
        }
      },
      async sleep(arg) {
        const secs = parseFloat(arg) || 1;
        emit(`sleeping for ${secs}s ...`, 'dim');
        await new Promise(r => setTimeout(r, secs * 1000));
      },
      async dmesg(arg) {
        // The firmware already filters the 2 KB ring server-side; asking for the whole ring and
        // filtering here would cost the same request and more of the browser's work for nothing.
        const m = arg && arg.match(/-l\s*([EWIDVewidv])/);
        const url = m ? '/api/logs?level=' + m[1].toUpperCase() : '/api/logs';
        try {
          const r = await fetch(url, { cache: 'no-store' });
          if (r.status === 401) { emit('dmesg: not paired (401)', 'err'); return; }
          if (!r.ok) { emit('dmesg: failed to read logs (status ' + r.status + ')', 'err'); return; }
          const text = await r.text();
          emit(text);
        } catch {
          emit('dmesg: device unreachable', 'err');
        }
      },
      async reboot() {
        emit('rebooting Cardputer ...', 'warn');
        try {
          const r = await fetch('/api/reboot', { method: 'POST' });
          if (r.ok) emit('Reboot command sent.', 'ok');
          else emit('reboot: failed', 'err');
        } catch {
          emit('reboot: failed (device unreachable)', 'err');
        }
      },
      env() {
        for (const [k, v] of Object.entries(envVars)) {
          emit(`${k}=${v}`);
        }
      },
      export(arg, ctx) {
        // Tokenised, `export X="a b"` arrives as one already-unquoted word, so the quote
        // stripping below would eat a legitimate leading/trailing quote in the value.
        const spec = ctx?.argv ? ctx.argv.slice(1).join(' ') : arg;
        if (!spec) {
          for (const [k, v] of Object.entries(envVars)) emit(`declare -x ${k}="${v}"`);
          return;
        }
        const m = spec.match(/^(\w+)\s*=\s*([\s\S]*)$/);
        if (!m) { emit('usage: export NAME=value', 'err'); return; }
        const name = m[1];
        const val = ctx?.argv ? m[2] : m[2].replace(/^"|"$/g, '');
        envVars[name] = val;
        emit(`${name}="${val}"`, 'ok');
      },
      async man(arg) {
        if (!arg) {
          const isIt = (envVars.LANG || (typeof navigator !== 'undefined' ? navigator.language : 'en') || 'en').startsWith('it');
          emit(isIt ? 'Quale pagina di manuale desideri?' : 'What manual page do you want?', 'warn');
          return;
        }
        const cmd = arg.trim().toLowerCase();
        const lang = (envVars.LANG || (typeof navigator !== 'undefined' ? navigator.language : 'en') || 'en').startsWith('it') ? 'it' : 'en';
        // The canonical home is /system/registry/manual — where the SD image puts the 43 pages and
        // where the Help app reads them. The old path is tried second, and only when the first
        // misses, so an SD laid out before the move still answers.
        let entry = await readJSON(`/system/registry/manual/${cmd}.info`);
        if (!entry) entry = await readJSON(`/system/manual/${cmd}.info`);
        if (entry && entry[lang]) {
          const loc = entry[lang];
          emit(`${cmd.toUpperCase()}(1) - ${loc.synopsis}`);
          emit('\nDescription:', 'dim');
          emit(`  ${loc.description}`);
          if (loc.details) {
            emit('\nDetails:', 'dim');
            emit(`  ${loc.details}`);
          }
        } else {
          const minimal = {
            help: {
              it: 'HELP(1) - Mostra i comandi disponibili.',
              en: 'HELP(1) - Display available commands.'
            },
            clear: {
              it: 'CLEAR(1) - Pulisce la schermata del terminale.',
              en: 'CLEAR(1) - Clear the terminal screen.'
            }
          };
          const fb = minimal[cmd];
          if (fb && fb[lang]) emit(fb[lang]);
          else {
            emit(lang === 'it' ? `Nessuna voce di manuale per ${cmd}` : `No manual entry for ${cmd}`, 'warn');
          }
        }
      },
      history(arg) {
        const a = (arg || '').trim().toLowerCase();
        if (a === 'clear') { hist.length = 0; histNew = hist.length; saveHistory(true); emit('history cleared', 'ok'); return; }
        const n = parseInt(a);
        const rows = (isFinite(n) && n > 0) ? hist.slice(-n) : hist;
        if (!rows.length) { emit('(empty history)', 'dim'); return; }
        const base = hist.length - rows.length;
        rows.forEach((cmd, i) => emit(`  ${base + i + 1}  ${cmd}`, '', { kind: 'cmd', name: cmd }));
      },
      async uname(arg) {
        const wantAll = arg && arg.trim().includes('-a');
        let s;
        try {
          const r = await fetch('/api/status', { cache: 'no-store' });
          s = r.ok ? await r.json() : null;
        } catch {}
        const osName = s?.os || 'NucleoOS';
        const version = s?.version || '0.1.0';
        if (wantAll) {
          emit(`${osName} cardputer ${version} esp32s3 generic xtensa`);
        } else {
          emit(osName);
        }
      },
      async status() {
        let s = null;
        try {
          const r = await fetch('/api/status', { cache: 'no-store' });
          if (r.ok) s = await r.json();
        } catch {}
        if (!s) { emit('status: device unreachable', 'err'); return; }
        emit(`${s.os || 'NucleoOS'} v${s.version || '?'}  ·  up ${s.uptime_s ?? '?'}s`);
        if (s.free_heap != null) emit('heap free  ' + fmtBytes(s.free_heap));
        if (s.storage) emit(`storage    ${s.storage.fs} · ${fmtBytes(s.storage.free_bytes)} free / ${fmtBytes(s.storage.total_bytes)}`);
        if (s.apps) emit('apps       ' + s.apps.installed + ' installed');
        const n = s.network;
        if (n) emit('network    ' + (n.time_synced ? 'NTP-synced' : 'no NTP') + (n.ssid ? ' · ' + n.ssid : ''),
          n.time_synced ? 'ok' : 'warn');
      },
      async free() {
        const s = await (async () => { try { const r = await fetch('/api/status', { cache: 'no-store' }); return r.ok ? r.json() : null; } catch { return null; } })();
        if (s?.free_heap != null) emit('free heap: ' + fmtBytes(s.free_heap), 'ok');
        else emit('free: status unavailable', 'err');
      },
      async date(arg) {
        const flags = arg || '';
        const utc = /(^|\s)-u(\s|$)/.test(flags), push = /(^|\s)-s(\s|$)/.test(flags);
        const fmt = (d) => utc ? d.toISOString().slice(0, 19) + 'Z'
          : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 19);
        emit('local  ' + fmt(new Date()));
        const s = await devJSON('date', '/api/status');
        if (!s) return;
        const n = s.network || {};
        if (n.time) emit('device ' + fmt(new Date(n.time * 1000)) + (n.time_synced ? ' (NTP-synced)' : ' (no NTP)'));
        else emit('device clock not reported', 'warn');
        if (!push) return;
        // No battery-backed RTC: when NTP has not landed, the browser's clock is the only one in the
        // room that is right, and a wrong device clock breaks TLS and every calendar entry at once.
        const r = await devPOST('date', '/api/time/set', { ts: Math.floor(Date.now() / 1000) });
        if (r) emit('device clock set from this browser', 'ok');
      },
      async theme(arg) {
        const want = (arg || '').trim().toLowerCase();
        if (want !== 'dark' && want !== 'light') {
          emit('theme: ' + (document.documentElement.dataset.theme || 'dark'));
          emit('usage: theme dark | theme light', 'dim'); return;
        }
        document.documentElement.dataset.theme = want;
        const s = await readJSON(SETTINGS) || {}; s.ui = s.ui || {}; s.ui.theme = want;
        try { await fetch('/api/fs/write?path=' + encodeURIComponent(SETTINGS),
          { method: 'POST', body: JSON.stringify(s, null, 2) }); emit('theme set to ' + want, 'ok'); }
        catch { emit('theme: applied locally (device unreachable)', 'warn'); }
      },

      // ---- filesystem extras ------------------------------------------------
      async stat(arg) {
        if (!arg) { emit('usage: stat <path>', 'err'); return; }
        const p = norm(arg.replace(/^"|"$/g, ''));
        const parent = p.replace(/\/[^/]*$/, '') || '/';
        const name = p.slice(parent === '/' ? 1 : parent.length + 1);
        const j = await devJSON('stat', '/api/fs/list?path=' + encodeURIComponent(parent));
        if (!j) return;
        const e = (j.entries || []).find((x) => x.name === name);
        if (!e) { emit('stat: no such file or directory: ' + p, 'err'); return; }
        emit('path       ' + p);
        emit('type       ' + e.type);
        emit('size       ' + (e.type === 'dir' ? '-' : (e.size || 0) + '  (' + fmtBytes(e.size || 0) + ')'));
        emit('protected  ' + (e.protected ? 'yes' : 'no'));
        // The list API reports no timestamp, and a plausible-looking invented one is worse than a gap.
        emit('modified   not reported by the device', 'dim');
      },
      async du(arg) {
        let depth = 2;
        const rest = (arg || '').replace(/-d\s*(\d+)/, (_, n) => {
          depth = Math.max(1, Math.min(parseInt(n), LIMITS.maxDepth)); return '';
        }).trim();
        const path = rest ? norm(rest.replace(/^"|"$/g, '')) : cwd;
        const own = new Map();
        const st = await bwalk(path, depth, (dir, d, entries) => {
          let n = 0;
          for (const e of entries) if (e.type !== 'dir') n += e.size || 0;
          own.set(dir, n);
        });
        if (!own.size) { emit('du: cannot read ' + path, 'err'); return; }
        // Deepest first, so every child total is final before its parent claims it.
        const total = new Map(own);
        const depthOf = (s) => s.split('/').length;
        for (const d of [...own.keys()].sort((a, b) => depthOf(b) - depthOf(a))) {
          if (d === path) continue;
          const parent = d.replace(/\/[^/]*$/, '') || '/';
          if (total.has(parent)) total.set(parent, total.get(parent) + total.get(d));
        }
        for (const [d, n] of [...total.entries()].sort((a, b) => b[1] - a[1])) emit(fmtBytes(n).padStart(9) + '\t' + d);
        if (st.capped) emit(`du: stopped after ${st.calls} directories — narrow the path or lower -d`, 'warn');
        emit(`total ${fmtBytes(total.get(path) || 0)} in ${st.calls} listing${st.calls === 1 ? '' : 's'}`, 'dim');
      },
      async tree(arg) {
        let depth = 3;
        const rest = (arg || '').replace(/-L\s*(\d+)/, (_, n) => {
          depth = Math.max(1, Math.min(parseInt(n), LIMITS.maxDepth)); return '';
        }).trim();
        const path = rest ? norm(rest.replace(/^"|"$/g, '')) : cwd;
        let dirs = 0, files = 0, shown = 0, cut = false;
        emit(path, 'dir');
        const st = await bwalk(path, depth, null, (full, d, e) => {
          if (shown >= LIMITS.maxRows) { cut = true; return; }
          shown++;
          const pad = '  '.repeat(d - 1);
          if (e.type === 'dir') { dirs++; emit(pad + '├ ' + e.name + '/', 'dir'); }
          else { files++; emit(pad + '├ ' + e.name, ''); }
        });
        if (!st.calls) { emit('tree: cannot read ' + path, 'err'); return; }
        if (cut) emit(`tree: showing the first ${LIMITS.maxRows} entries`, 'warn');
        if (st.capped) emit(`tree: stopped after ${st.calls} directories — lower -L`, 'warn');
        emit(`${dirs} director${dirs === 1 ? 'y' : 'ies'}, ${files} file${files === 1 ? '' : 's'}`, 'dim');
      },
      async hexdump(arg) {
        let n = 256, off = 0;
        const rest = (arg || '')
          .replace(/-n\s*(\d+)/, (_, v) => { n = Math.max(1, Math.min(parseInt(v), 4096)); return ''; })
          .replace(/-s\s*(\d+)/, (_, v) => { off = parseInt(v); return ''; }).trim();
        if (!rest) { emit('usage: hexdump [-n bytes] [-s offset] <file>', 'err'); return; }
        const p = norm(rest.replace(/^"|"$/g, ''));
        // A Range request is why this is safe on a 640 MB video: the device streams 256 bytes,
        // not the file. /api/fs/read answers 206 for a range it can satisfy.
        let r;
        try {
          r = await fetch('/api/fs/read?path=' + encodeURIComponent(p),
            { cache: 'no-store', headers: { Range: `bytes=${off}-${off + n - 1}` } });
        } catch { emit('hexdump: cannot reach the file API', 'err'); return; }
        if (r.status === 401) { emit('hexdump: not paired (401)', 'err'); return; }
        if (!r.ok) { fsFail('hexdump', p, r); return; }
        let bytes = [];
        try { bytes = Array.from(new Uint8Array(await r.arrayBuffer())); }
        catch { bytes = utf8Bytes(await r.text()); }
        bytes = bytes.slice(0, n);
        if (!bytes.length) { emit('(empty)', 'dim'); return; }
        const rows = [];
        for (let i = 0; i < bytes.length; i += 16) {
          const chunk = bytes.slice(i, i + 16);
          const hex = chunk.map((b) => b.toString(16).padStart(2, '0')).join(' ').padEnd(47);
          const asc = chunk.map((b) => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
          rows.push((off + i).toString(16).padStart(8, '0') + '  ' + hex + '  |' + asc + '|');
        }
        emit(rows.join('\n'));
      },
      async base64(arg, ctx) {
        const dec = /(^|\s)-d(\s|$)/.test(arg || '');
        const rest = (arg || '').replace(/(^|\s)-d(\s|$)/, ' ').trim();
        let bytes = null, text = null;
        if (rest) {
          const p = norm(rest.replace(/^"|"$/g, ''));
          let r;
          try { r = await api('read', p); } catch { emit('base64: cannot reach the file API', 'err'); return; }
          if (!r.ok) { fsFail('base64', p, r); return; }
          if (dec) text = await r.text();
          else { try { bytes = Array.from(new Uint8Array(await r.arrayBuffer())); } catch { bytes = utf8Bytes(await r.text()); } }
        } else if (ctx?.stdin != null) {
          if (dec) text = ctx.stdin; else bytes = utf8Bytes(ctx.stdin);
        } else { emit('usage: base64 [-d] [file]', 'err'); return; }
        if (dec) { emit(utf8Text(b64decode(text))); return; }
        emit(b64encode(bytes).replace(/(.{76})/g, '$1\n'));
      },
      async tee(arg, ctx) {
        if (!arg) { emit('usage: tee <file>', 'err'); return; }
        const p = norm(arg.replace(/^"|"$/g, ''));
        const body = ctx?.stdin != null ? ctx.stdin : '';
        try {
          const r = await api('write', p, { method: 'POST', body });
          if (!r.ok) { fsFail('tee', p, r); return; }
        } catch { emit('tee: file API unavailable', 'err'); return; }
        emit(body);                       // transparent, or it is not tee
      },

      // ---- text, entirely in the browser ------------------------------------
      seq(arg) {
        const nums = (arg || '').split(/\s+/).filter(Boolean).map(Number);
        if (!nums.length || nums.some((n) => !isFinite(n))) { emit('usage: seq [first] last', 'err'); return; }
        const first = nums.length > 1 ? nums[0] : 1;
        const last = nums.length > 1 ? nums[1] : nums[0];
        const count = Math.abs(last - first) + 1;
        if (count > LIMITS.maxRows * 5) { emit(`seq: refusing more than ${LIMITS.maxRows * 5} lines`, 'err'); return; }
        const step = last >= first ? 1 : -1, rows = [];
        for (let i = 0; i < count; i++) rows.push(String(first + i * step));
        emit(rows.join('\n'));
      },
      sort(arg, ctx) {
        if (ctx?.stdin == null) { emit('sort: reads standard input — put it after a pipe', 'err'); return; }
        const f = arg || '';
        const km = f.match(/-k\s*(\d+)/), key = km ? parseInt(km[1]) : 0;
        const field = (s) => key ? (s.trim().split(/\s+/)[key - 1] || '') : s;
        let rows = ctx.stdin.split(/\r?\n/);
        rows.sort((a, b) => /-n/.test(f)
          ? (parseFloat(field(a)) || 0) - (parseFloat(field(b)) || 0)
          : field(a).localeCompare(field(b)));
        if (/-r/.test(f)) rows.reverse();
        if (/-u/.test(f)) rows = rows.filter((l, i) => i === 0 || l !== rows[i - 1]);
        emit(rows.join('\n'));
      },
      uniq(arg, ctx) {
        if (ctx?.stdin == null) { emit('uniq: reads standard input — put it after a pipe', 'err'); return; }
        const count = /-c/.test(arg || ''), rows = [];
        let prev = null, n = 0;
        const flush = () => { if (prev !== null) rows.push(count ? String(n).padStart(4) + ' ' + prev : prev); };
        for (const l of ctx.stdin.split(/\r?\n/)) {
          if (l === prev) { n++; continue; }
          flush(); prev = l; n = 1;
        }
        flush();
        emit(rows.join('\n'));
      },
      // `tr SET1 SET2` and `tr -d SET`. No ranges/classes — a Cardputer shell trades POSIX
      // completeness for bytes, and 1:1 translation plus delete covers what a pipe actually needs
      // (uppercasing a column, stripping carriage returns). Sets are taken literally, char for char.
      tr(arg, ctx) {
        if (ctx?.stdin == null) { emit('tr: reads standard input — put it after a pipe', 'err'); return; }
        const argv = String(arg || '').match(/"[^"]*"|\S+/g) || [];
        const del = argv[0] === '-d';
        const sets = (del ? argv.slice(1) : argv).map((s) => s.replace(/^"|"$/g, ''));
        if (del) {
          if (!sets[0]) { emit('usage: tr -d <set>', 'err'); return; }
          const drop = new Set([...sets[0]]);
          emit([...ctx.stdin].filter((c) => !drop.has(c)).join(''));
          return;
        }
        if (sets.length < 2 || !sets[0]) { emit('usage: tr <set1> <set2>   |   tr -d <set>', 'err'); return; }
        const from = [...sets[0]], to = [...sets[1]];
        const map = new Map(from.map((c, i) => [c, to[Math.min(i, to.length - 1)] ?? c]));
        emit([...ctx.stdin].map((c) => (map.has(c) ? map.get(c) : c)).join(''));
      },
      cut(arg, ctx) {
        if (ctx?.stdin == null) { emit('cut: reads standard input — put it after a pipe', 'err'); return; }
        const f = arg || '';
        const cm = f.match(/-c\s*(\d+)-(\d+)/);
        const dm = f.match(/-d\s*"?(\S)"?/);
        const fm = f.match(/-f\s*([\d,-]+)/);
        if (!cm && !fm) { emit('usage: cut -d<char> -f<list>  |  cut -c<from>-<to>', 'err'); return; }
        const delim = dm ? (dm[1] === 't' && /-d\s*"?\\t/.test(f) ? '\t' : dm[1]) : '\t';
        const wanted = (n) => {
          const picked = [];
          for (const part of (fm ? fm[1] : '1').split(',')) {
            const r = part.split('-');
            const a = parseInt(r[0]) || 1;
            const b = r.length > 1 ? (parseInt(r[1]) || n) : a;
            for (let i = a; i <= Math.min(b, n); i++) picked.push(i);
          }
          return picked;
        };
        const rows = ctx.stdin.split(/\r?\n/).map((l) => {
          if (cm) return l.slice(parseInt(cm[1]) - 1, parseInt(cm[2]));
          const parts = delim === ' ' ? l.trim().split(/\s+/) : l.split(delim);
          return wanted(parts.length).map((i) => parts[i - 1] ?? '').join(delim === ' ' ? ' ' : delim);
        });
        emit(rows.join('\n'));
      },

      // ---- shell ------------------------------------------------------------
      alias(arg, ctx) {
        // On a 56-key thumb keyboard the cost is the typing, so an alias is worth more here than
        // on a desktop — and it costs the device nothing at all once it is saved.
        let spec = (ctx?.argv ? ctx.argv.slice(1).join(' ') : (arg || '')).trim();
        if (spec.length > 1 && spec[0] === '"' && spec.endsWith('"')) spec = spec.slice(1, -1);
        if (!spec) {
          const keys = Object.keys(aliases).sort();
          if (!keys.length) { emit('(no aliases)', 'dim'); return; }
          for (const k of keys) emit(`${k}='${aliases[k]}'`);
          return;
        }
        const m = spec.match(/^([A-Za-z_][\w-]*)\s*=\s*([\s\S]+)$/);
        if (!m) {
          const v = aliases[spec];
          if (v) emit(`${spec}='${v}'`); else { emit('alias: ' + spec + ': not found', 'err'); }
          return;
        }
        const val = m[2].trim().replace(/^"([\s\S]*)"$/, '$1').replace(/^'([\s\S]*)'$/, '$1');
        aliases[m[1]] = val;
        emit(`${m[1]}='${val}'`, 'ok');
        saveAliases();
      },
      unalias(arg) {
        const n = (arg || '').trim().replace(/^"|"$/g, '');
        if (!n) { emit('usage: unalias <name>', 'err'); return; }
        if (!(n in aliases)) { emit('unalias: ' + n + ': not found', 'err'); return; }
        delete aliases[n];
        emit('removed ' + n, 'ok');
        saveAliases();
      },
      async which(arg) {
        const n = (arg || '').trim().replace(/^"|"$/g, '');
        if (!n) { emit('usage: which <name>', 'err'); return; }
        if (aliases[n]) { emit(`${n}: alias for '${aliases[n]}'`); return; }
        if (COMMANDS[n]) { emit(`${n}: shell builtin`); return; }
        const list = await appList('which');
        if (!list) return;
        const a = list.find((x) => x.id === n || String(x.name || '').toLowerCase() === n.toLowerCase());
        if (a) emit(`${n}: app → ${a.route || '/apps/' + a.id + '/'}${a.enabled === false ? ' (disabled)' : ''}`);
        else emit(`${n}: not found`, 'warn');
      },
      async watch(arg, ctx) {
        // `isPipe` alone is not enough: the LAST stage of a pipeline writes to the screen, so it is
        // not captured — but it still must not be re-run in place every three seconds.
        if (ctx?.isPipe || ctx?.stdin != null) { emit('watch: cannot run inside a pipeline', 'err'); return; }
        if (watching) { emit('watch: already watching', 'err'); return; }
        let every = 3, times = 10;
        let rest = (arg || '')
          .replace(/-n\s*(\d+(?:\.\d+)?)/, (_, v) => { every = parseFloat(v); return ''; })
          .replace(/-c\s*(\d+)/, (_, v) => { times = parseInt(v); return ''; }).trim();
        if (!rest) { emit('usage: watch [-n seconds] [-c count] <command>', 'err'); return; }
        rest = rest.replace(/^"([\s\S]*)"$/, '$1');
        // Two seconds is a floor, not a default: this shares four sockets with the whole OS, and a
        // one-second watch is indistinguishable from hammering the device by hand.
        every = Math.max(2, every || 3);
        times = Math.max(1, Math.min(times, 300));
        watching = true;
        let fails = 0;
        try {
          for (let i = 1; i <= times && !aborted; i++) {
            const mark = childCount();
            const before = errors;
            addLine(`every ${every}s · tick ${i}/${times} · ${rest}`, 'dim');
            await exec(rest);
            if (errors > before) {
              if (++fails >= 3) { emit('watch: three failures in a row — stopping', 'err'); break; }
            } else fails = 0;
            if (i >= times || aborted) break;
            await new Promise((r) => setTimeout(r, every * 1000));
            if (!aborted) dropSince(mark);        // redraw in place; the scrollback stays readable
          }
        } finally { watching = false; }
      },

      // ---- system -----------------------------------------------------------
      async diag(arg) {
        // One request for the whole picture, where status+heap+cpu+anima would be four.
        const j = await devJSON('diag', '/api/diag');
        if (!j) return;
        const pre = (arg || '').trim().replace(/^"|"$/g, '');
        const rows = flatten(j, '', []).filter((l) => !pre || l.startsWith(pre));
        if (!rows.length) { emit('diag: no key starts with ' + pre, 'warn'); return; }
        emit(rows.join('\n'));
      },
      async heap() {
        // Fragmentation, not free bytes, is the documented bottleneck — and `free` cannot show it.
        const j = await devJSON('heap', '/api/heap');
        if (j) emit(flatten(j, '', []).join('\n'));
      },
      async cpu() {
        const j = await devJSON('cpu', '/api/cpu');
        if (j) emit(flatten(j, '', []).join('\n'));
      },
      async apps(arg) {
        const a = (arg || '').trim();
        const m = a.match(/^open\s+(\S+)$/);
        if (m) {
          const id = m[1].replace(/^"|"$/g, '');
          try { parent.postMessage({ type: 'open-app', id }, '*'); emit('opening ' + id + ' …', 'dim'); }
          catch { emit('apps: shell not reachable', 'err'); }
          return;
        }
        const all = /(^|\s)-a(\s|$)/.test(a);
        const list = await appList('apps');
        if (!list) return;
        let n = 0;
        for (const x of list) {
          if (!all && x.enabled === false) continue;
          emit([x.id, x.name || x.id, x.enabled === false ? 'off' : 'on', x.route || ''].join('\t'));
          n++;
        }
        emit(`${n} app${n === 1 ? '' : 's'}`, 'dim');
      },
      // `ps` on this OS is the app table — the closest thing to a process list on a device that runs
      // one foreground app plus the shell. It is `apps` seen through a Linux lens, on purpose: the
      // words people's fingers already know should do the obvious thing here too.
      async ps() {
        const list = await appList('ps');
        if (!list) return;
        emit('PID   STATE  APP', 'dim');
        let pid = 1;
        for (const x of list) {
          if (x.enabled === false) continue;
          emit(String(pid++).padStart(3) + '   ' + (x.running ? 'run ' : 'idle') + '   ' + (x.id || ''));
        }
      },
      // `kill <app-id>` closes a foreground app window through the shell — a real action on a real
      // OS, so it is by id, not by the synthetic PID `ps` prints (those renumber every listing).
      kill(arg) {
        const id = (arg || '').trim().replace(/^"|"$/g, '');
        if (!id) { emit('usage: kill <app-id>   (see `ps`)', 'err'); return; }
        try { parent.postMessage({ type: 'close-app', id }, '*'); emit('sent close → ' + id, 'dim'); }
        catch { emit('kill: shell not reachable', 'err'); }
      },
      // Raw pin read/write against the firmware allowlist. The device refuses a pin outside its safe
      // set with a 403, and this surfaces that verbatim rather than pretending it worked — a terminal
      // that lies about hardware is worse than no terminal.
      async gpio(arg) {
        const argv = String(arg || '').match(/\S+/g) || [];
        const sub = (argv[0] || '').toLowerCase();
        if (sub === 'read' || sub === 'get') {
          const pin = parseInt(argv[1], 10);
          if (Number.isNaN(pin)) { emit('usage: gpio read <pin>', 'err'); return; }
          const j = await devJSON('gpio', '/api/gpio?pin=' + pin);
          if (j) emit(j.ok ? `pin ${j.pin} = ${j.value}` : 'gpio: ' + (j.err || 'refused'), j.ok ? '' : 'err');
          return;
        }
        if (sub === 'write' || sub === 'set') {
          const pin = parseInt(argv[1], 10), val = argv[2] === '1' || argv[2] === 'high' ? 1 : 0;
          if (Number.isNaN(pin)) { emit('usage: gpio write <pin> <0|1>', 'err'); return; }
          const j = await devPOST('gpio', '/api/gpio', { pin, value: val });
          if (j) emit(j.ok ? `pin ${j.pin} = ${j.value}` : 'gpio: ' + (j.err || 'refused'), j.ok ? 'ok' : 'err');
          return;
        }
        emit('usage: gpio read <pin>   |   gpio write <pin> <0|1>', 'err');
      },
      async assoc(arg) {
        const j = await devJSON('assoc', '/api/associations');
        if (!j) return;
        const map = j.default_open || {};
        const want = (arg || '').trim().toLowerCase().replace(/^["'.]+|["']+$/g, '');
        if (want) { emit(want + '\t' + (map[want] || j.fallback || '(none)')); return; }
        for (const k of Object.keys(map).sort()) emit(k + '\t' + map[k]);
        emit('*\t' + (j.fallback || '(none)'));
      },
      async lang(arg) {
        const want = (arg || '').trim().toLowerCase().replace(/^"|"$/g, '');
        if (!want) { const j = await devJSON('lang', '/api/lang'); if (j) emit(`lang ${j.lang} gen ${j.gen}`); return; }
        if (!['it', 'en', 'fr', 'es', 'de'].includes(want)) { emit('usage: lang [it|en|fr|es|de]', 'err'); return; }
        const j = await devPOST('lang', '/api/lang', { lang: want });
        if (j) emit(`lang ${j.lang || want} gen ${j.gen == null ? '?' : j.gen}`, 'ok');
      },
      async ota(arg) {
        // Status only. The device reboots ~800 ms after the last OTA byte, so a mistyped path in a
        // shell with history recall would be an irreversible flash one keystroke away.
        const a = (arg || '').trim().toLowerCase();
        if (a && a !== 'status') { emit('ota: only "ota status" is available here — flashing lives in the release tooling', 'err'); return; }
        const s = await devJSON('ota', '/api/status');
        if (!s) return;
        const o = s.ota || {};
        emit(`running ${o.running || '?'}  next ${o.next || '?'}  state ${o.state || '?'}  rollback ${o.rollback_enabled ? 'on' : 'off'}`);
      },

      // ---- ANIMA, the offline brain -----------------------------------------
      async anima(arg, ctx) {
        const argv = ctx?.argv ? ctx.argv.slice(1) : (String(arg || '').match(/"[^"]*"|\S+/g) || []);
        let mode = '', lang = '', reset = false, verbose = false, caps = false, l1 = null;
        const words = [];
        for (let i = 0; i < argv.length; i++) {
          const a = String(argv[i]);
          if (a === '-o') mode = String(argv[++i] || '').toLowerCase();
          else if (a === '-l') lang = String(argv[++i] || '').toLowerCase().slice(0, 2);
          else if (a === '-v') verbose = true;
          else if (a === '--reset') reset = true;
          else if (a === '--caps') caps = true;
          else if (a === '--l1') l1 = String(argv[++i] || '').toLowerCase();
          else words.push(a.replace(/^"|"$/g, ''));
        }
        if (caps) {
          const c = await devJSON('anima', '/api/anima/caps');
          if (c) emit(`l1=${c.l1Mode} serving=${c.l1Serving ? 'yes' : 'no'} enabled=${c.enabled ? 'yes' : 'no'}`
            + ` key=${c.hasKey ? 'yes' : 'no'} online=${c.online ? 'yes' : 'no'}`);
          return;
        }
        if (l1 !== null) {
          if (!['on', 'off', 'auto'].includes(l1)) { emit('usage: anima --l1 on|off|auto', 'err'); return; }
          const j = await devPOST('anima', '/api/anima/l1', { mode: l1 });
          if (j) emit(`l1=${j.l1Mode || l1} serving=${j.l1Serving ? 'yes' : 'no'}`, 'ok');
          return;
        }
        let q = words.join(' ');
        // The firmware's query buffer is 160 bytes behind a 208-byte URL buffer, so a 2 KB log
        // cannot be shipped: the browser digests it first and the device only ever sees the digest.
        if (ctx?.stdin != null && ctx.stdin.trim()) {
          const d = animaDigest(ctx.stdin);
          q = q ? q + ' | ' + d : d;
        }
        q = encTrim(q, ANIMA_Q_ENC);
        if (!q) { emit('usage: anima [-o off|on|only] [-l it|en] [-v] <question>', 'err'); return; }
        // Notes bypass the sink on purpose: down a pipe `anima` yields the reply and nothing else.
        if (ctx?.stdin != null) addLine('asked: ' + q, 'dim');
        let url = '/api/anima?q=' + encodeURIComponent(q);
        if (lang) url += '&lang=' + encodeURIComponent(lang);
        if (mode) url += '&mode=' + encodeURIComponent(mode);
        if (reset) url += '&reset=1';
        let j = null;
        for (let attempt = 0; attempt < 2; attempt++) {
          let r;
          try { r = await fetch(url, { cache: 'no-store' }); }
          catch { emit('anima: cannot reach the device', 'err'); return; }
          if (r.status === 401) { emit('anima: not paired (401)', 'err'); return; }
          // The brain is single-owner; 503 means another turn holds it, not that it is broken.
          if (r.status === 503) {
            if (attempt) { emit('anima: brain busy — try again', 'warn'); return; }
            let wait = 250;
            try { wait = (await r.json()).retry_after_ms || 250; } catch {}
            await new Promise((res) => setTimeout(res, wait));
            continue;
          }
          if (!r.ok) { emit('anima: failed (status ' + r.status + ')', 'err'); return; }
          try { j = await r.json(); } catch { emit('anima: invalid response', 'err'); return; }
          break;
        }
        if (!j) return;
        const reply = String(j.reply || '').trim();
