<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkeys</title>
<style>
  :root { --bg:#0b1020; --card:#141a2e; --line:#243049; --fg:#e8eefc; --mut:#8aa0c8; --acc:#4ea1ff; --good:#7CFC9A; --warn:#ffd166; --bad:#ff5a5a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; font-weight:600; margin:4px 0 2px; display:flex; align-items:center; gap:8px; }
  h1 svg { width:22px; height:22px; }
  .sub { color:var(--mut); font-size:12px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .k { color:var(--mut); }
  .v { font-weight:600; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .ok { color:var(--good); border-color:#2a6b45; } .no { color:var(--warn); border-color:#6b5a2a; }
  .hw { color:var(--good); } .swk { color:var(--warn); }
  button { font:inherit; color:var(--fg); background:#1c2540; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.danger:hover { border-color:var(--bad); color:var(--bad); }
  button.del { padding:4px 9px; font-size:12px; }
  .cred { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; }
  .cred + .cred { border-top:1px solid var(--line); }
  .cred .rp { font-weight:600; } .cred .u { color:var(--mut); font-size:12px; }
  .empty { color:var(--mut); padding:8px 0; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .msg { font-size:12px; margin-top:8px; min-height:16px; }
  .hint { color:var(--mut); font-size:12px; margin-top:10px; }
  .pinform { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .pinform input { font:inherit; color:var(--fg); background:#0e1428; border:1px solid var(--line); border-radius:8px; padding:7px 10px; width:100%; }
  .pinform input:focus { border-color:var(--acc); outline:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>
    <svg viewBox="0 0 24 24" fill="none" stroke="#4ea1ff" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="12" r="5"/><path d="M13 12h8M18 12v4M21 12v3"/></svg>
    <span data-i18n="title">Passkeys</span>
  </h1>
  <div class="sub" data-i18n="sub">Manage your NucleoOS FIDO security key</div>

  <div class="card" id="status">
    <div class="row"><span class="k" data-i18n="key">Wrapping key</span><span class="v" id="v-key">…</span></div>
    <div class="row"><span class="k" data-i18n="pin">On-device PIN</span><span class="v" id="v-pin">…</span></div>
    <div class="row"><span class="k" data-i18n="usb">USB host</span><span class="v" id="v-usb">…</span></div>
    <div class="row"><span class="k" data-i18n="cnt">Resident passkeys</span><span class="v" id="v-cnt">…</span></div>
  </div>

  <div class="card">
    <div class="row" style="border:0;padding-top:0"><span class="v" data-i18n="list">Passkeys</span></div>
    <div id="creds"><div class="empty" data-i18n="load">Loading…</div></div>
  </div>

  <div class="card">
    <div class="actions">
      <button id="b-pin" data-i18n="setpin">Set / change PIN</button>
      <button id="b-reset" class="danger" data-i18n="reset">Reset authenticator</button>
      <button id="b-refresh" data-i18n="refresh">Refresh</button>
    </div>
    <div class="pinform" id="pinform" hidden>
      <input id="pin1" type="password" autocomplete="new-password" maxlength="63" data-i18n-attr="placeholder:askpin">
      <input id="pin2" type="password" autocomplete="new-password" maxlength="63" data-i18n-attr="placeholder:confpin">
      <div class="actions">
        <button id="pin-ok" data-i18n="save">Save</button>
        <button id="pin-cancel" data-i18n="cancel">Cancel</button>
      </div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="hint" data-i18n="hint">The PIN is stored only on the device and never crosses USB. Passkey private keys never leave the Cardputer.</div>
  </div>
</div>

<script type="module">
// First-class OS i18n (was an inline EN/IT-only table): catalogs in i18n.<lang>.json, engine wiring
// via /nucleo-i18n.js — data-i18n handles the static labels (live language switch included), t()
// covers the dynamic strings below.
import I18N from '/nucleo-i18n.js';
const t = await I18N.init('passkeys');

const $ = id => document.getElementById(id);
async function api(path, opts){ const r = await fetch(path, Object.assign({credentials:'same-origin'}, opts)); if (!r.ok) throw new Error('http '+r.status); return r.json(); }
function msg(s, cls){ const m=$('msg'); m.textContent=s; m.style.color = cls==='bad' ? 'var(--bad)' : cls==='good' ? 'var(--good)' : 'var(--mut)'; }

async function refresh(){
  try {
    const s = await api('/api/fido/status');
    $('v-key').textContent = s.keyHardware ? t('hw') : t('sw');
    $('v-key').className = 'v ' + (s.keyHardware ? 'hw' : 'swk');
    $('v-pin').textContent = s.pinSet ? (t('set') + ' · ' + s.pinRetries + ' ' + t('tries')) : t('notset');
    $('v-usb').textContent = s.connected ? t('conn') : t('wait');
    $('v-cnt').textContent = s.credCount;
    const creds = await api('/api/fido/creds');
    const box = $('creds'); box.innerHTML = '';
    if (!Array.isArray(creds) || !creds.length) { box.innerHTML = '<div class="empty">'+t('empty')+'</div>'; return; }
    for (const c of creds){
      const row = document.createElement('div'); row.className='cred';
      const left = document.createElement('div');
      left.innerHTML = '<div class="rp"></div><div class="u"></div>';
      left.querySelector('.rp').textContent = c.rp || '?';
      left.querySelector('.u').textContent = (c.user || '') + '  ·  #' + c.signCount;
      const b = document.createElement('button'); b.className='del danger'; b.textContent=t('del');
      b.onclick = async () => {
        try {
          const r = await api('/api/fido/cred/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index:c.index})});
          msg(r.ok?t('delok'):t('err'), r.ok?'good':'bad');
        } catch(e){ msg(t('err'),'bad'); }
        refresh();
      };
      row.append(left, b); box.appendChild(row);
    }
  } catch(e){ msg(t('err'),'bad'); }
}

$('b-refresh').onclick = () => { msg(''); refresh(); };
function pinShow(on){
  $('pinform').hidden = !on;
  $('pin1').value=''; $('pin2').value='';
  if (on) { msg(''); $('pin1').focus(); }
}
async function pinSubmit(){
  const a = $('pin1').value, b = $('pin2').value;
  if (a.length < 4 || a.length > 63) { msg(t('pinbad'),'bad'); return; }
  if (a !== b) { msg(t('pinmm'),'bad'); return; }
  try {
    const r = await api('/api/fido/pin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:a})});
    msg(r.ok?t('pinok'):t('pinbad'), r.ok?'good':'bad');
    if (r.ok) pinShow(false);
  } catch(e){ msg(t('err'),'bad'); }
  refresh();
}
$('b-pin').onclick = () => pinShow($('pinform').hidden);
$('pin-ok').onclick = pinSubmit;
$('pin-cancel').onclick = () => pinShow(false);
$('pinform').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); pinSubmit(); }
  else if (e.key === 'Escape') { e.preventDefault(); pinShow(false); }
});
$('b-reset').onclick = async () => {
  if (!confirm(t('askreset'))) return;
  try {
    const r = await api('/api/fido/reset',{method:'POST'});
    msg(r.ok?t('resetok'):t('err'), r.ok?'good':'bad');
  } catch(e){ msg(t('err'),'bad'); }
  refresh();
};

I18N.onChange(() => refresh());   // dynamic strings repaint on a live language switch (data-i18n is engine-handled)
refresh();
</script>
</body>
</html>
